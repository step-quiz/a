<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Equacions — versió adaptada per a diversitat">
    <link rel="icon" href="icon-green.png">
    <title>Equacions (adaptat)</title>

    <!--
    ============================================================
    FITXER: a-equacions.html
    ROL: Versió adaptada de equacions.html per a alumnes amb
         retard d'aprenentatge, discapacitat intel·lectual lleu o TDAH.

    DIFERÈNCIES RESPECTE A equacions.html:
      · Sempre 1 sol pas: trobar x directament.
      · Sense historial d'equacions equivalents (eq-history).
      · Sense "pas X de Y" ni coeficients ni reorganitzacions.
      · Quatre tipus d'equació, un per nivell:
          Nivell 1: a·x = b   (a ∈ [2..5], x ∈ [1..9], tot positiu)
          Nivell 2: x + b = c  (b ∈ [1..5], x ∈ [1..9])
          Nivell 3: x + b = c  i  x − b = c  (b ∈ [1..8], x ∈ [1..12])
          Nivell 4: Tot l'anterior + b + x = c
      · La x es mostra com "3 · x" (punt de multiplicació explícit).
      · La x apareix sempre en color verd fosc (--var-color).
      · Botó Ajuda amb metàfora de la caixa de caramels.
      · Si s'esgoten els intents, es mostra la resposta correcta.
      · Paràmetres per defecte més conservadors.

    PARÀMETRES URL (específics):
      ?nivell=1|2|3|4     Nivell (default 2)

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 4)
      ?maxintents=N       (default 5)
      ?maxenllocmitjana=  (default 1)

    EXEMPLE:
      a-equacions.html?nivell=1&totaloperations=4&maxintents=6
    ============================================================
    -->

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    4,
            defaultIntents:       5,
            defaultEnllocMitjana: 1
        };
    </script>

    <script src="js/utils.js"></script>
    <script src="js/config.js"></script>

    <link rel="stylesheet" href="css/shared.css">

    <style>
        /* ── PALETA ESPECÍFICA D'EQUACIONS ────────────────────── */
        :root {
            --bg-color:      #f5f4ec;
            --primary:       #5a6a1e;
            --primary-light: #e5e8c8;
            --primary-hover: #3d4a14;
            --primary-dark:  #1c1f0e;
            --var-color:     #3d4a14;   /* color de la x */
            --var-bg:        #e5e8c8;
            --var-border:    #9aa45a;
        }

        h1         { color: #1c1f0e; margin-bottom: 2px; }
        .title-row { margin-bottom: 6px; }
        .panel     { border-top-color: var(--primary); }

        /* ── EQUACIÓ PRINCIPAL ────────────────────────────────── */
        .equation-display {
            padding: 28px 20px 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 2.4em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            min-height: 100px;
        }

        /* Termes de l'equació */
        .eq-var-token {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--var-bg);
            border: 2px solid var(--var-border);
            border-radius: 10px;
            color: var(--var-color);
            line-height: 1;
        }
        .eq-coeff    { color: var(--var-color); }
        .eq-dot      { color: #475569; font-size: 0.85em; }
        .eq-x        { color: var(--var-color); font-style: italic; }

        .eq-num-token {
            padding: 8px 14px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            color: #334155;
            line-height: 1;
        }

        .eq-op {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 8px 16px;
            color: #64748b;
            font-weight: bold;
        }

        .eq-sign {
            color: var(--primary);
            font-weight: bold;
            padding: 0 6px;
        }

        /* ── PREGUNTA SIMPLE ──────────────────────────────────── */
        .question-label {
            text-align: center;
            font-size: 1.1em;
            font-weight: 700;
            color: #475569;
            padding: 0 20px 12px;
        }

        /* ── PANELL DE RESOLUCIÓ ──────────────────────────────── */
        .resolution-panel {
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 20px 20px 22px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        /* Fila: x = [input] */
        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .answer-x-label {
            color: var(--var-color);
            font-style: italic;
            background: var(--var-bg);
            border: 2px solid var(--var-border);
            border-radius: 10px;
            padding: 8px 14px;
            line-height: 1;
        }
        .answer-eq { color: var(--primary); padding: 0 4px; }

        input[type="text"]#value-input {
            width: 130px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            font-weight: bold;
            padding: 12px;
            text-align: center;
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]#value-input:focus {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        /* ── FILA BOTONS: OK + Ajuda ──────────────────────────── */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #btn-submit-val {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0;
            width: 2.4rem;
            height: 2.4rem;
            background-color: #cbd5e1;
            color: #334155;
            border-color: #94a3b8;
            transition: background-color 0.15s, color 0.15s;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #btn-submit-val:focus-visible { outline: 3px solid var(--primary); }
        #btn-submit-val:active        { transform: scale(0.95); }
        @media (hover: hover) {
            #btn-submit-val:hover {
                background-color: var(--primary);
                border-color: var(--primary-dark);
                color: white;
            }
        }
        #btn-submit-val.error-shake {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: shake 0.2s;
        }

        /* ── BOTÓ AJUDA ───────────────────────────────────────── */
        .btn-ajuda {
            background: #fffbeb;
            color: #92400e;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-ajuda:hover  { background: #fef3c7; }
        .btn-ajuda:active { transform: scale(0.96); }

        /* ── CAIXA D'AJUDA ────────────────────────────────────── */
        .help-text {
            display: none;
            background: #fffbeb;
            border: 2px solid #fde68a;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 1.05em;
            color: #78350f;
            font-weight: 600;
            text-align: center;
            width: fit-content;
            max-width: min(800px, 95%);
            white-space: nowrap;
            line-height: 1.4;
            animation: fadeIn 0.25s ease;
        }
        @media (max-width: 640px) {
            .help-text { white-space: normal; max-width: 95%; }
        }
        .help-text.visible { display: block; }

        /* ── RESPOSTA CORRECTA ────────────────────────────────── */
        .answer-reveal {
            display: none;
            font-size: 1.05em;
            color: #b91c1c;
            font-weight: 600;
            text-align: center;
            background: #fef2f2;
            border: 2px solid #fca5a5;
            border-radius: 10px;
            padding: 12px 24px;
            animation: fadeIn 0.35s ease;
            max-width: 320px;
        }
        .answer-reveal.visible { display: block; }
        .answer-reveal .ans-val {
            font-size: 1.5em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: block;
            margin-top: 4px;
            color: var(--var-color);
        }

        /* ── NIVELL A LA CAPÇALERA ────────────────────────────── */
        .level-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .nivell-badge {
            font-size: 0.9em;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ── BOTÓ TUTORIAL ────────────────────────────────────── */
        .btn-tutorial {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            font-size: 0.9em;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .btn-tutorial:hover  { background: #99f6e4; }
        .btn-tutorial:active { transform: scale(0.96); }

        .tut-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #dc2626;
            flex-shrink: 0;
            animation: tutDotPulse 0.8s ease-in-out 5;
            animation-fill-mode: forwards;
        }
        @keyframes tutDotPulse {
            0%, 100% { opacity: 1;   transform: scale(1); }
            50%      { opacity: 0.2; transform: scale(0.65); }
        }

        /* ── FADE OVERLAY ─────────────────────────────────────── */
        #fade-overlay {
            position: fixed; inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        /* ── RESPONSIU ────────────────────────────────────────── */
        @media (max-width: 480px) {
            .equation-display { font-size: 1.8em; padding: 18px 10px 14px; gap: 8px; min-height: 80px; }
            .eq-var-token, .eq-num-token { padding: 6px 10px; border-radius: 8px; }
            .answer-row { font-size: 1.6em; gap: 10px; }
            input[type="text"]#value-input { width: 110px; padding: 10px; }
            .resolution-panel { padding: 16px 14px 18px; gap: 12px; }
            .help-text { font-size: 0.97em; padding: 12px 14px; }
        }
        @media (max-width: 350px) {
            .equation-display { font-size: 1.5em; }
        }

        /* ── SVG CAIXA DE CARAMELS (ax=b) ────────────────────── */
        .box-hint {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            animation: fadeIn 0.3s ease;
        }
        .box-hint.visible { display: flex; }
        /* ── ANIMACIÓ INTENTS ─────────────────────────────────── */
        @keyframes attemptsBlink {
            0%, 100% { background-color: #fef3c7; border-color: #d1d5db; color: #334155; }
            50%       { background-color: #e5e7eb; border-color: #f59e0b; color: #334155; }
        }
        .attempts-counter.blink { animation: attemptsBlink 0.2s linear 5; }
    </style>

<script>
'use strict';

// ============================================================
// PARÀMETRES URL ESPECÍFICS
// ============================================================

const _aParams = new URLSearchParams(window.location.search);

/**
 * ?nivell=1  a·x = b                        (tot positiu)
 * ?nivell=2  x + b = c                       (default)
 * ?nivell=3  x + b = c  i  x − b = c
 * ?nivell=4  tot l'anterior + b + x = c
 */
const NIVELL = getIntParam(_aParams, 'nivell', 2, 1, 4);

// ============================================================
// ELEMENTS DOM
// ============================================================

const els = {
    body:             document.body,
    gameScreen:       document.getElementById('game-screen'),
    sessionDisplay:   document.getElementById('session-display'),
    lvlDisplay:       document.getElementById('lvl-display'),
    nivellDisplay:    document.getElementById('nivell-display'),
    scoreDisplay:     document.getElementById('score-display'),
    attemptsDisplay:  document.getElementById('attempts-display'),
    equationDisplay:  document.getElementById('equation-display'),
    questionLabel:    document.getElementById('question-label'),
    resolutionPanel:  document.getElementById('resolution-panel'),
    valueInput:       document.getElementById('value-input'),
    btnSubmitVal:     document.getElementById('btn-submit-val'),
    helpText:         document.getElementById('help-text'),
    answerReveal:     document.getElementById('answer-reveal'),
    answerCorrectVal: document.getElementById('answer-correct-val'),
};

// ============================================================
// ESTAT LOCAL
// ============================================================

let isPenalizing    = false;
let currentEq       = null;   // { type, a, b, c, xSol }
let expectedAnswer  = 0;
let _helpVisible    = false;

// ============================================================
// GENERACIÓ D'EQUACIONS
// ============================================================

/**
 * Retorna els tipus d'equació disponibles per al nivell actiu.
 * type:
 *   'ax_b'   →  a·x = b          (nivell 1+)
 *   'xpb_c'  →  x + b = c        (nivell 2+)
 *   'xmb_c'  →  x − b = c        (nivell 3+)
 *   'bpx_c'  →  b + x = c        (nivell 4)
 */
function getAvailableTypes() {
    const t = [];
    if (NIVELL >= 1) t.push('ax_b');
    if (NIVELL >= 2) t.push('xpb_c');
    if (NIVELL >= 2) t.push('xmb_c');   // x−a=b disponible des de nivell 2
    if (NIVELL >= 4) t.push('bpx_c');
    return t;
}

function generateEquation() {
    const types = getAvailableTypes();
    const type  = pick(types);
    let a, b, c, xSol;

    if (type === 'ax_b') {
        // a·x = b, a ∈ [2..5], x ∈ [1..9], b = a·x (positiu)
        a    = randInt(2, 5);
        xSol = randInt(1, 9);
        b    = a * xSol;
        return { type, a, b, xSol };

    } else if (type === 'xpb_c') {
        // x + b = c, b ∈ [1..5], x ∈ [1..9]
        b    = randInt(1, NIVELL >= 3 ? 8 : 5);
        xSol = randInt(1, NIVELL >= 3 ? 12 : 9);
        c    = xSol + b;
        return { type, b, c, xSol };

    } else if (type === 'xmb_c') {
        // x − b = c, b ∈ [1..8], x ∈ [2..12], c = x − b > 0
        b    = randInt(1, 8);
        xSol = randInt(b + 1, 12);   // x > b perquè c > 0
        c    = xSol - b;
        return { type, b, c, xSol };

    } else {
        // b + x = c, b ∈ [1..8], x ∈ [1..12]
        b    = randInt(1, 8);
        xSol = randInt(1, 12);
        c    = b + xSol;
        return { type, b, c, xSol };
    }
}

// ============================================================
// RENDERITZACIÓ DE L'EQUACIÓ
// ============================================================

/**
 * Retorna l'HTML del token de la x (amb coeficient si n'hi ha).
 * Exemples: "x", "3 · x"
 */
function xToken(coeff = 1) {
    if (coeff === 1) {
        return `<span class="eq-var-token"><span class="eq-x">x</span></span>`;
    }
    return `<span class="eq-var-token">
        <span class="eq-coeff">${coeff}</span>
        <span class="eq-dot">·</span>
        <span class="eq-x">x</span>
    </span>`;
}

function numToken(n) {
    return `<span class="eq-num-token">${n}</span>`;
}

function opToken(op) {
    return `<span class="eq-op">${op}</span>`;
}

function renderEquation(eq) {
    const EQ = `<span class="eq-sign">=</span>`;
    if (eq.type === 'ax_b') {
        return xToken(eq.a) + EQ + numToken(eq.b);
    } else if (eq.type === 'xpb_c') {
        return xToken() + opToken('+') + numToken(eq.b) + EQ + numToken(eq.c);
    } else if (eq.type === 'xmb_c') {
        return xToken() + opToken('−') + numToken(eq.b) + EQ + numToken(eq.c);
    } else {
        // bpx_c: b + x = c
        return numToken(eq.b) + opToken('+') + xToken() + EQ + numToken(eq.c);
    }
}

// ============================================================
// AJUDA CONTEXTUAL — metàfora de la caixa de caramels
// ============================================================

// ============================================================
// ESQUEMA GRÀFIC DE CAIXES (per a ax=b)
// Mostra 'a' caixes, cadascuna amb '?' caramels,
// i una etiqueta "Total: b caramels" a sota.
// ============================================================

function buildBoxSVG(a, b) {
    const BOX_W  = 44;   // amplada de cada caixa
    const BOX_H  = 36;   // alçada de cada caixa
    const GAP    = 8;    // espai entre caixes
    const PAD    = 10;   // marge lateral
    const W      = a * (BOX_W + GAP) - GAP + PAD * 2;
    const H      = BOX_H + 28;  // caixa + espai per a l'etiqueta total
    const s      = [];

    s.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
             style="max-width:${Math.min(W, 320)}px;width:100%;height:auto;display:block;">`);

    for (let i = 0; i < a; i++) {
        const x = PAD + i * (BOX_W + GAP);
        const y = 4;
        // Caixa
        s.push(`<rect x="${x}" y="${y}" width="${BOX_W}" height="${BOX_H}"
                 fill="#e5e8c8" stroke="#5a6a1e" stroke-width="2" rx="6"/>`);
        // Interrogant dins la caixa
        s.push(`<text x="${x + BOX_W/2}" y="${y + BOX_H/2 + 6}"
                 text-anchor="middle" font-family="'Courier New',monospace"
                 font-size="16" font-weight="800" fill="#3d4a14" font-style="italic">x</text>`)
    }

    // Clau/fletxa sota les caixes → total
    const lineY = 4 + BOX_H + 6;
    s.push(`<line x1="${PAD}" y1="${lineY}" x2="${W - PAD}" y2="${lineY}"
             stroke="#94a3b8" stroke-width="1.5"/>`);
    s.push(`<line x1="${PAD}" y1="${lineY}" x2="${PAD}" y2="${lineY - 5}"
             stroke="#94a3b8" stroke-width="1.5"/>`);
    s.push(`<line x1="${W - PAD}" y1="${lineY}" x2="${W - PAD}" y2="${lineY - 5}"
             stroke="#94a3b8" stroke-width="1.5"/>`);
    s.push(`<text x="${W/2}" y="${lineY + 16}"
             text-anchor="middle" font-family="'Segoe UI',sans-serif"
             font-size="12" font-weight="700" fill="#475569">Total: ${b} caramels</text>`);

    s.push(`</svg>`);
    return s.join('');
}

function getHelpText(eq) {
    if (eq.type === 'ax_b') {
        return `🎁 Tinc ${eq.a} caixes iguals. En total hi ha ${eq.b} caramels. Quants n'hi ha a cada caixa?`;
    } else if (eq.type === 'xpb_c') {
        return `🎁 Tinc una caixa amb uns quants caramels.<br>N'afegeixo ${eq.b} caramels, i ara en tinc ${eq.c}.<br>Quants n'hi havia al principi?`;
    } else if (eq.type === 'xmb_c') {
        return `🎁 En una caixa amb uns quants caramels, traiem ${eq.b} caramels.<br>Mirem la caixa i queden ${eq.c} caramels a dins.<br>Quants caramels hi havia al principi?`;
    } else {
        return `🎁 Tinc ${eq.b} caramels i una caixa amb X. En total en tinc ${eq.c}. Quants n'hi ha a la caixa?`;
    }
}

function toggleHelp() {
    _helpVisible = !_helpVisible;
    const boxHint    = document.getElementById('box-hint');
    const boxHintSvg = document.getElementById('box-hint-svg');

    if (_helpVisible) {
        els.helpText.innerHTML = getHelpText(currentEq);
        els.helpText.classList.add('visible');

        // Esquema gràfic: ~50% de vegades, i només per a ax=b
        if (boxHint && currentEq.type === 'ax_b' && Math.random() < 0.5) {
            boxHintSvg.innerHTML = buildBoxSVG(currentEq.a, currentEq.b);
            boxHint.classList.add('visible');
        }
    } else {
        els.helpText.classList.remove('visible');
        if (boxHint) boxHint.classList.remove('visible');
    }
}

function resetHelp() {
    _helpVisible = false;
    els.helpText.classList.remove('visible');
    els.helpText.textContent = '';
    const boxHint = document.getElementById('box-hint');
    if (boxHint) boxHint.classList.remove('visible');
}

// ============================================================
// UPDATE CAPÇALERA
// ============================================================

function updateHeader() {
    els.sessionDisplay.innerText  = `Sessió ${currentSession + 1} de ${TOTAL_SESSIONS}`;
    els.lvlDisplay.innerText      = `Equació ${currentOperation + 1} de ${TOTAL_OPERATIONS}`;
    els.nivellDisplay.innerText   = `· Nivell ${NIVELL}`;
    els.scoreDisplay.innerText    = `Punts: ${sessionScore}`;
    els.attemptsDisplay.innerText = `Intents: ${attemptsLeft}`;
    els.attemptsDisplay.className = 'attempts-counter' +
        (attemptsLeft <= 2 ? ' danger' : '');
}

// ============================================================
// LÒGICA PRINCIPAL
// ============================================================

/** Cridat per game-core.js via startSession(). */
function buildLevel() {
    attemptsLeft    = MAX_INTENTS;
    isPenalizing    = false;
    isTransitioning = false;

    currentEq      = generateEquation();
    expectedAnswer = currentEq.xSol;

    els.body.style.backgroundColor =
        bgColors[(currentSession * TOTAL_OPERATIONS + currentOperation) % bgColors.length];

    resetHelp();
    els.answerReveal.classList.remove('visible');
    els.valueInput.value              = '';
    els.resolutionPanel.style.display = 'none';

    updateHeader();

    // Mostrar l'equació i la pregunta
    els.equationDisplay.innerHTML = renderEquation(currentEq);
    els.questionLabel.textContent = 'Troba quant val la x';

    // Obrir el panell de resposta
    els.resolutionPanel.style.display = 'flex';

    if (isTouchDevice()) showCustomKeyboard(els.valueInput);
    else                 els.valueInput.focus();
}

function checkValue() {
    if (isTransitioning || isPenalizing) return;
    const raw = els.valueInput.value.trim();
    if (raw === '') return;
    if (!/^-?\d+$/.test(raw)) { shakeInput(); penalize(); return; }

    const userAnswer = parseInt(raw, 10);
    const question   = `Equació ${currentOperation + 1}`;

    if (userAnswer !== expectedAnswer) {
        shakeInput();
        recordAnswerToHistory(question, raw, false);
        penalize();
        if (isTouchDevice()) kbMarkForOverwrite(els.valueInput);
        else { els.valueInput.value = ''; els.valueInput.focus(); }
        return;
    }

    recordAnswerToHistory(question, raw, true);
    hideCustomKeyboard();
    finishEquation(true);
}

function shakeInput() {
    els.btnSubmitVal.classList.add('error-shake');
    setTimeout(() => els.btnSubmitVal.classList.remove('error-shake'), 200);
}

function penalize() {
    if (isPenalizing || isTransitioning) return;
    isPenalizing = true;
    els.attemptsDisplay.classList.add('blink');

    setTimeout(() => {
        els.attemptsDisplay.classList.remove('blink');
        attemptsLeft--;
        updateHeader();

        if (attemptsLeft <= 0) {
            isTransitioning = true;
            hideCustomKeyboard();
            els.answerCorrectVal.textContent = expectedAnswer;
            els.answerReveal.classList.add('visible');
            setTimeout(() => finishEquation(false), 2400);
        }

        isPenalizing = false;
    }, 700);
}

function finishEquation(success) {
    recordResult(success ? Math.min(MAX_INTENTS - attemptsLeft + 1, 3) : 4);
    const fails       = MAX_INTENTS - attemptsLeft;
    const levelPoints = success ? Math.max(0, 10 - fails * 2) : 0;
    sessionScore += levelPoints;

    const waitTime = showMiniOverlay(levelPoints, {
        successColor: 'var(--primary-dark)',
        pointsColor:  'var(--primary)'
    });

    setTimeout(() => {
        hideMiniOverlay();
        if (currentOperation + 1 >= TOTAL_OPERATIONS) {
            endSession();
        } else {
            currentOperation++;
            buildLevel();
        }
    }, waitTime);
}

// ── Teclat físic ────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (els.gameScreen.style.display === 'none') return;
    if (els.resolutionPanel.style.display === 'none') return;
    e.preventDefault();
    if (!isTransitioning) checkValue();
});

function checkCurrentCell() { checkValue(); }

// ── Botó Tutorial ───────────────────────────────────────────
document.getElementById('btn-tutorial').addEventListener('click', () => {
    const overlay = document.getElementById('fade-overlay');
    overlay.style.pointerEvents = 'all';
    overlay.style.opacity       = '1';
    setTimeout(() => { window.location.href = 'a-equacions-tutorial.html'; }, 800);
});

// ============================================================
// INICI
// ============================================================

injectSharedHTML();
validateConfig();
initCustomKeyboard({ allowNegative: false });   // x sempre positiu
startGame();
</script>
