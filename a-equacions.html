<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Equacions — versió adaptada per a diversitat">
    <link rel="icon" href="icon-green.png">
    <title>Equacions</title>

    <!--
    ============================================================
    FITXER: a-equacions.html
    ROL: Activitat d'equacions de primer grau d'un sol pas per a l'aula d'acollida.
         Versió adaptada d'equacions.html (operacions), ja amb el motor nou.
    JAVASCRIPT: js/a-equacions/a-equacions.js (pantalla, teclat, punts),
         js/a-equacions/generador.js (equacions i comprovació, lògica pura) i
         js/a-equacions/vista.js (l'HTML de cada peça); motor comú a js/game-core.js.

    COM ES LLEGEIX (poques paraules, a propòsit):
      · L'equació en gran («x + 3 = 8») i, a sota, «x = [ ]». Només hi ha nombres,
        la x i símbols.
      · Si la resposta no és bona, no hi ha cap frase: surt l'equació amb la resposta
        substituïda («4 + 3 = 7 ≠ 8 ✖»).
      · Botó 💡 (cada toc fa el següent): l'equació dibuixada amb caixes i caramels
        («🎁x + 3🍬 = 8🍬») → el dibuix i l'operació que dona la x («8 − 3 = ?») → res.
      · Si s'esgoten els intents, la solució surt al camp, en verd.

    NIVELLS (via ?nivell=):
      Nivell 1: a·x = b  (a de 2 a 5, x d'1 a 9).  (default)
      Nivell 2: també x + b = c i x − b = c.
      Nivell 3: els mateixos amb nombres més grans.
      Nivell 4: també b + x = c.

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 4)
      ?maxintents=N       (default 5)
      ?fixed=A|B|C        Sessió fixa (js/fixed-sessions.js)
    ============================================================
    -->

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    4,
            defaultIntents:       5
        };
    </script>

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/accessibilitat.css">

    <style>
        /* ── PALETA ESPECÍFICA D'EQUACIONS ────────────────────── */
        :root {
            --bg-color:      #f5f4ec;
            --primary:       #5a6a1e;
            --primary-light: #e5e8c8;
            --primary-hover: #3d4a14;
            --primary-dark:  #1c1f0e;
            --var-color:     #3d4a14;   /* color de la x */
            --var-bg:        #e5e8c8;
            --var-border:    #9aa45a;
        }

        h1         { color: #1c1f0e; margin-bottom: 2px; }
        .title-row { margin-bottom: 6px; }
        .panel     { border-top-color: var(--primary); }

        /* ── EQUACIÓ PRINCIPAL ────────────────────────────────── */
        .equation-display {
            padding: 28px 20px 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 2.4em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            min-height: 100px;
        }

        /* Termes de l'equació */
        .eq-var-token {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--var-bg);
            border: 2px solid var(--var-border);
            border-radius: 10px;
            color: var(--var-color);
            line-height: 1;
        }
        .eq-coeff    { color: var(--var-color); }
        .eq-dot      { color: #475569; font-size: 0.85em; }
        .eq-x        { color: var(--var-color); font-style: italic; }

        .eq-num-token {
            padding: 8px 14px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            color: #334155;
            line-height: 1;
        }

        .eq-op {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 8px 16px;
            color: #64748b;
            font-weight: bold;
        }

        .eq-sign {
            color: var(--primary);
            font-weight: bold;
            padding: 0 6px;
        }

        /* ── PREGUNTA SIMPLE ──────────────────────────────────── */
        .question-label {
            text-align: center;
            font-size: 1.1em;
            font-weight: 700;
            color: #475569;
            padding: 0 20px 12px;
        }

        /* ── PANELL DE RESOLUCIÓ ──────────────────────────────── */
        .resolution-panel {
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 20px 20px 22px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        /* Fila: x = [input] */
        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .answer-x-label {
            color: var(--var-color);
            font-style: italic;
            background: var(--var-bg);
            border: 2px solid var(--var-border);
            border-radius: 10px;
            padding: 8px 14px;
            line-height: 1;
        }
        .answer-eq { color: var(--primary); padding: 0 4px; }

        input[type="text"]#value-input {
            width: 130px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            font-weight: bold;
            padding: 12px;
            text-align: center;
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]#value-input:focus {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        /* ── FILA BOTONS: OK + Ajuda ──────────────────────────── */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #btn-submit-val {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0;
            width: 2.4rem;
            height: 2.4rem;
            background-color: #cbd5e1;
            color: #334155;
            border-color: #94a3b8;
            transition: background-color 0.15s, color 0.15s;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #btn-submit-val:focus-visible { outline: 3px solid var(--primary); }
        #btn-submit-val:active        { transform: scale(0.95); }
        @media (hover: hover) {
            #btn-submit-val:hover {
                background-color: var(--primary);
                border-color: var(--primary-dark);
                color: white;
            }
        }
        #btn-submit-val.error-shake {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: shake 0.2s;
        }

        /* ── BOTÓ AJUDA ───────────────────────────────────────── */
        .btn-ajuda {
            background: #fffbeb;
            color: #92400e;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-ajuda:hover  { background: #fef3c7; }
        .btn-ajuda:active { transform: scale(0.96); }

        /* ── CAIXA D'AJUDA ────────────────────────────────────── */
        .help-text {
            display: none;
            background: #fffbeb;
            border: 2px solid #fde68a;
            border-radius: 10px;
            padding: 12px 28px;
            font-size: 1.05em;
            color: #78350f;
            font-weight: 600;
            text-align: center;
            width: fit-content;
            max-width: min(800px, 95%);
            white-space: nowrap;
            line-height: 1.4;
            animation: fadeIn 0.25s ease;
        }
        @media (max-width: 640px) {
            .help-text { white-space: normal; max-width: 95%; }
        }
        .help-text.visible { display: block; }

        /* ── RESPOSTA CORRECTA ────────────────────────────────── */
        .answer-reveal {
            display: none;
            font-size: 1.05em;
            color: #b91c1c;
            font-weight: 600;
            text-align: center;
            background: #fef2f2;
            border: 2px solid #fca5a5;
            border-radius: 10px;
            padding: 12px 24px;
            animation: fadeIn 0.35s ease;
            max-width: 320px;
        }
        .answer-reveal.visible { display: block; }
        .answer-reveal .ans-val {
            font-size: 1.5em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: block;
            margin-top: 4px;
            color: var(--var-color);
        }

        /* ── NIVELL A LA CAPÇALERA ────────────────────────────── */
        .level-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .nivell-badge {
            font-size: 0.9em;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ── BOTÓ TUTORIAL ────────────────────────────────────── */
        .btn-tutorial {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            font-size: 0.9em;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .btn-tutorial:hover  { background: #99f6e4; }
        .btn-tutorial:active { transform: scale(0.96); }

        .tut-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #dc2626;
            flex-shrink: 0;
            animation: tutDotPulse 0.8s ease-in-out 5;
            animation-fill-mode: forwards;
        }
        @keyframes tutDotPulse {
            0%, 100% { opacity: 1;   transform: scale(1); }
            50%      { opacity: 0.2; transform: scale(0.65); }
        }

        /* ── FADE OVERLAY ─────────────────────────────────────── */
        #fade-overlay {
            position: fixed; inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        /* ── RESPONSIU ────────────────────────────────────────── */
        @media (max-width: 480px) {
            .equation-display { font-size: 1.8em; padding: 18px 10px 14px; gap: 8px; min-height: 80px; }
            .eq-var-token, .eq-num-token { padding: 6px 10px; border-radius: 8px; }
            .answer-row { font-size: 1.6em; gap: 10px; }
            input[type="text"]#value-input { width: 110px; padding: 10px; }
            .resolution-panel { padding: 16px 14px 18px; gap: 12px; }
            .help-text { font-size: 0.97em; padding: 12px 14px; }
        }
        /* En pantalles estretes el nivell es queda al costat del número de l'equació (no es parteix en tres línies) */
        @media (max-width: 480px) {
            .level-row { justify-content: center; }
            .level-row .level-text { width: auto; }
        }
        @media (max-width: 350px) {
            .equation-display { font-size: 1.5em; }
        }

        /* ── L'AJUDA: caixes i caramels dibuixats ───────────────── */
        .ajuda-dibuix { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-family: 'Courier New', Courier, monospace; font-weight: 800; font-size: 1.5em; }
        .ajuda-grup { display: inline-flex; flex-wrap: nowrap; gap: 4px; }
        .ajuda-caixa { display: inline-flex; align-items: center; gap: 2px; font-size: 1.3em; }
        .ajuda-caixa i { font-size: 0.6em; color: var(--var-color); }
        .ajuda-caramels { white-space: nowrap; color: #78350f; }
        .ajuda-caramels span { font-size: 0.9em; margin-left: 2px; }
        .ajuda-op { color: #475569; }
        .ajuda-operacio { margin-top: 6px; font-family: 'Courier New', Courier, monospace; font-weight: 800; font-size: 1.5em; color: #78350f; }

        /* ── LA RESPOSTA EQUIVOCADA, SUBSTITUÏDA ────────────────── */
        .part-feedback { display: flex; justify-content: center; }
        .part-feedback:empty { display: none; }
        .part {
            display: inline-flex; align-items: center; gap: 0.4em; padding: 2px 14px; border: 2px solid; border-radius: 10px;
            font-family: 'Courier New', Courier, monospace; font-size: 1.5em; font-weight: 800; animation: fadeIn 0.2s ease;
        }
        .part.mal { color: #b91c1c; background: #fef2f2; border-color: #fca5a5; }
        input[type="text"]#value-input.reveal { border-color: var(--success); background: #dcfce7; color: #166534; }

        /* ── BOTÓ «NIVELL SEGÜENT» ───────────────────────────────
         * Només puja de nivell (mai baixa); el nivell 4 és el màxim i no el té. */
        #btn-next-level {
            display: none; align-items: center; gap: 5px; padding: 5px 12px; font-size: 0.85em; font-weight: 700;
            color: var(--primary); background: var(--primary-light); border: 2px solid var(--primary);
            border-radius: 20px; cursor: pointer; white-space: nowrap; touch-action: manipulation;
        }
        #btn-next-level.visible { display: inline-flex; }
        @media (hover: hover) { #btn-next-level:hover { background: #d4d9a8; } }
        @media (max-width: 480px) { #btn-next-level { width: 100%; justify-content: center; } }
        /* ── ANIMACIÓ INTENTS ─────────────────────────────────── */
        @keyframes attemptsBlink {
            0%, 100% { background-color: #fef3c7; border-color: #d1d5db; color: #334155; }
            50%       { background-color: #e5e7eb; border-color: #f59e0b; color: #334155; }
        }
        .attempts-counter.blink { animation: attemptsBlink 0.2s linear 5; }
    </style>
<link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon-green.png" alt="Inici" onerror="this.style.display='none'">
    </a>
    <h1>Equacions</h1>
    <button class="btn-tutorial" id="btn-tutorial" aria-label="Veure tutorial">
        <span class="tut-dot" aria-hidden="true"></span>
        Tutorial
    </button>
</div>

<div id="fade-overlay"></div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">

        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display"></div>
                <div class="level-row">
                    <div class="level-text"   id="lvl-display"></div>
                    <div class="nivell-badge" id="nivell-display"></div>
                </div>
            </div>
            <div class="score-text"  id="score-display"></div>
            <!-- Botó per pujar de nivell (mai baixar). El nivell 4 és el màxim. -->
            <button id="btn-next-level"></button>
            <div id="attempts-display" class="attempts-counter"></div>
        </div>

        <!-- L'equació en gran -->
        <div class="equation-display" id="equation-display" role="group"></div>

        <!-- Panell de resposta -->
        <div class="resolution-panel" id="resolution-panel">

            <!-- Fila: x = [input] -->
            <div class="answer-row" id="answer-row">
                <span class="answer-x-label" id="answer-x-label"></span>
                <span class="answer-eq">=</span>
                <input type="text"
                       id="value-input"
                       autocomplete="off"
                       aria-label="Escriu la resposta">
            </div>

            <!-- OK + Ajuda -->
            <div class="action-row">
                <button class="btn-submit" id="btn-submit-val" onclick="checkValue()">OK</button>
                <button class="btn-ajuda"  onclick="toggleHelp()" aria-label="Ajuda">💡</button>
            </div>

            <!-- La resposta equivocada, substituïda: «4 + 3 = 7 ≠ 8 ✖» -->
            <div class="part-feedback" id="part-feedback" aria-live="polite"></div>

            <!-- L'ajuda: caixes i caramels dibuixats -->
            <div class="help-text" id="help-text" aria-live="polite"></div>

        </div>

    </div>
    <!-- #mini-victory-overlay, #session-end-screen, #final-screen
         s'injecten via injectSharedHTML() de game-core.js -->
</div>

<script type="module" src="js/a-equacions/a-equacions.js"></script>
</body>
</html>
