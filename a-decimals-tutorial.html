<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial — Diners i canvi</title>
  <style>
    :root {
      --primary:       #5a6a1e;
      --primary-light: #e5e8c8;
      --primary-dark:  #1c1f0e;
      --bg:            #f4f6e8;
      --panel:         #ffffff;
      --text:          #1c1f0e;
      --muted:         #64748b;
      --border:        #e2e8f0;
      --radius:        10px;
      --bill-bg:       #f0fdf4;
      --bill-border:   #bbf7d0;
      --bill-color:    #166534;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 14px 6px;
    }

    /* ── CAPÇALERA PÀGINA ─── */
    .title-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 7px;
      width: 100%; max-width: 920px;
      justify-content: center;
    }
    .title-row h1 {
      font-size: 1.25em; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--primary-dark);
    }
    .home-icon-link {
      width: 36px; height: 36px; opacity: 0.7;
      transition: opacity 0.2s; display: block; flex-shrink: 0;
    }
    .home-icon-link:hover { opacity: 1; }
    .home-icon-link img { width: 100%; height: 100%; object-fit: contain; }

    /* ── PANELL ─── */
    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      width: 100%; max-width: 920px;
      overflow: hidden;
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── CAPÇALERA TUTORIAL ─── */
    .tut-header {
      background: var(--primary-dark);
      color: white;
      padding: 8px 14px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .step-dots {
      display: flex; gap: 6px; align-items: center;
      flex: 1;
    }
    .step-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      transition: background 0.4s ease, transform 0.4s ease;
      flex-shrink: 0;
    }
    .step-dot.done    { background: #a3b54a; }
    .step-dot.current { background: white; transform: scale(1.55); }

    .btn-pause {
      background: white; border: 2px solid #ea580c;
      color: #ea580c; font-size: 1.1em; font-weight: 800;
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.15s; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(234,88,12,0.2);
    }
    .btn-pause:hover { background: #fff7ed; }

    /* ── BARRA TIMER ─── */
    .timer-track { height: 5px; background: rgba(0,0,0,0.08); flex-shrink: 0; }
    .timer-fill  { height: 100%; background: linear-gradient(90deg,#84a010,#5a6a1e); width:0%; }

    /* ── COS PRINCIPAL ─── */
    .game-body {
      display: flex; flex-direction: row;
      flex: 1 1 0; min-height: 0;
      transition: opacity 0.22s ease;
    }
    .game-body.fading { opacity: 0; pointer-events: none; }

    /* ── PANELL ESQUERRE: NOMÉS narrador, centrat verticalment ─── */
    .game-left {
      width: 38%; flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px 18px;
      border-right: 1px solid var(--border);
      overflow-y: auto; min-height: 0;
    }

    /* ── MOCK DE BOTIGA ─── */
    .mock-shop {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      width: 100%;
    }
    .mock-products-row {
      display: flex; justify-content: center;
      align-items: flex-start; gap: 12px; flex-wrap: wrap;
    }
    .mock-card {
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      padding: 10px 16px;
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      min-width: 90px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .mock-card.pulse {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(90,106,30,0.18);
    }
    .mock-emoji { font-size: 2.2em; line-height: 1; }
    .mock-nom   { font-size: 0.9em; color: #475569; font-weight: 600; }
    .mock-price {
      font-size: 1.3em;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold; color: #1e293b;
    }
    .mock-plus {
      font-size: 1.6em; font-weight: bold;
      color: #94a3b8; align-self: center;
    }
    .mock-bill {
      display: flex; align-items: center;
      justify-content: center; gap: 8px;
      padding: 8px 18px;
      background: var(--bill-bg);
      border: 2px solid var(--bill-border);
      border-radius: 10px;
      font-size: 1em; font-weight: 700;
      color: var(--bill-color);
    }
    .mock-bill.hidden { visibility: hidden; }

    /* Mock input + OK */
    .mock-answer-wrap {
      display: flex; align-items: center;
      justify-content: center; gap: 8px;
      font-size: 1.5em;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }
    .mock-prompt {
      font-size: 1em; font-weight: 700;
      color: #334155; text-align: center;
    }
    .mock-input {
      width: 110px; background: white;
      border: 2px solid #e2e8f0;
      border-radius: 8px; padding: 8px;
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85em; font-weight: bold;
      color: #1e293b; line-height: 1;
    }
    .mock-input.correct {
      background: #f0fdf4; border-color: var(--primary);
      color: #166534;
    }
    .mock-unit { color: #475569; font-size: 0.6em; }
    .mock-ok {
      width: 2rem; height: 2rem;
      background: #cbd5e1; border: 1.5px solid #94a3b8;
      border-radius: 6px; font-weight: 700; font-size: 0.75rem;
      color: #334155; cursor: default;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* Step-done tick */
    .mock-step-done {
      color: #166534; font-weight: 700;
      font-size: 0.9em; text-align: center;
    }

    /* ── STORY STRIP ─── */
    .story-strip {
      display: flex; align-items: center; justify-content: center;
      flex-wrap: wrap; row-gap: 6px; column-gap: 8px;
      padding: 10px 14px;
      background: var(--primary-light);
      border: 2px solid #b8be8a;
      border-radius: 14px;
      font-size: 1.65em;
      width: 100%; min-height: 58px;
      animation: stripIn 0.35s ease;
      flex-shrink: 0;
    }
    @keyframes stripIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .s-op {
      font-size: 0.55em; font-weight: 900;
      color: var(--primary-dark);
      background: white; border: 1.5px solid #b8be8a;
      border-radius: 8px; padding: 4px 9px; line-height: 1;
    }
    .s-res {
      font-size: 0.62em; font-weight: 900;
      background: white; border: 2.5px solid var(--primary);
      border-radius: 10px; padding: 4px 10px;
      color: var(--primary-dark);
      font-family: 'Courier New', monospace; line-height: 1.2;
    }
    .s-eq { font-size: 0.6em; font-weight: 900; color: var(--primary); }

    /* ── NARRADOR ─── */
    .narration-box {
      width: 100%; background: white;
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex; align-items: flex-start; gap: 10px;
      flex-shrink: 0;
    }
    .narration-text { font-size: 0.97em; line-height: 1.55; color: var(--text); }
    .narration-text b { color: var(--primary-dark); }
    .narration-text .g { color: var(--primary); font-weight: 700; }

    /* ── PANELL DRET: story strip + mock botiga + visual SVG ─── */
    .game-right {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 10px 16px 8px;
      overflow-y: auto; min-height: 0;
      gap: 10px;
      background: linear-gradient(160deg, #fafff6 0%, #f4f6e8 100%);
    }
    /* Mock botiga al panell dret */
    #tut-shop {
      width: 100%;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    #tut-visual {
      width: 100%;
      display: flex; justify-content: center; align-items: center;
      flex: 1; min-height: 0; flex-shrink: 0;
    }
    #tut-visual svg  { display: block; max-width: 100%; height: auto; }
    #tut-visual > div { max-width: 100%; }

    /* ── SPOTLIGHT ─── */
    .game-left, .game-right {
      transition: opacity 0.5s ease, box-shadow 0.5s ease;
    }
    .game-left.spotlight  { box-shadow: inset 0 0 0 3px var(--primary); background: #fafff6; }
    .game-right.spotlight { box-shadow: inset 0 0 0 3px var(--primary); }
    .game-left.dimmed  { opacity: 0.20; }
    .game-right.dimmed { opacity: 0.20; }

    /* ── MEGA BOTÓ ─── */
    .next-zone {
      padding: 9px 20px 11px;
      display: flex; justify-content: center; align-items: center;
      flex-shrink: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    .btn-mega-next {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 44px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white; border: none; border-radius: 50px;
      font-family: inherit; font-size: 1.3em; font-weight: 900;
      letter-spacing: 0.5px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(90,106,30,0.38);
      animation: megaPulse 2.6s ease-in-out infinite;
      transition: transform 0.1s;
    }
    .btn-mega-next:active { transform: scale(0.95) !important; }
    .btn-mega-next:hover  { animation-play-state: paused; }
    .btn-mega-next.btn-finish {
      background: linear-gradient(135deg, #16a34a 0%, #14532d 100%);
      box-shadow: 0 4px 24px rgba(22,163,74,0.4);
    }
    .mega-arrows {
      display: inline-flex;
      animation: arrowBounce 1.3s ease-in-out infinite;
      font-size: 1.1em;
    }
    @keyframes arrowBounce {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(5px); }
    }
    @keyframes megaPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 4px 24px rgba(90,106,30,0.38); }
      50%      { transform: scale(1.04); box-shadow: 0 6px 36px rgba(90,106,30,0.58), 0 0 0 8px rgba(90,106,30,0.10); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ─── */
    @media (max-width: 680px) {
      body { overflow: auto; height: auto; padding: 6px; }
      .panel { flex: none; min-height: 580px; }
      .game-body { flex-direction: column; }
      .game-left, .game-right { width: 100% !important; border-right: none; }
      .game-left  { border-bottom: 1px solid var(--border); padding: 12px; }
      .game-right { padding: 10px; min-height: 200px; }
      .btn-mega-next { font-size: 1.1em; padding: 11px 30px; }
    }
    @media (max-width: 440px) {
      .title-row h1   { font-size: 0.9em; }
      .btn-mega-next  { font-size: 1em; padding: 10px 22px; }
      .story-strip    { font-size: 1.3em; }
    }
  </style>
  <link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
  <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
    <img src="icon-green.png" alt="Inici" onerror="this.style.display='none'">
  </a>
  <h1>Tutorial — Diners i canvi</h1>
</div>

<div class="panel">

  <div class="tut-header">
    <div class="step-dots" id="step-dots"></div>
    <button class="btn-pause" id="btn-pause" aria-label="Pausa/Repren">⏸</button>
  </div>

  <div class="timer-track">
    <div class="timer-fill" id="timer-fill"></div>
  </div>

  <div class="game-body" id="game-body">

    <!-- Esquerra: NOMÉS el text de narració -->
    <div class="game-left" id="game-left">
      <div class="narration-box" id="narration-box">
        <div class="narration-text" id="narration-text"></div>
      </div>
    </div>

    <!-- Dreta: mock botiga + story strip + visual SVG -->
    <div class="game-right" id="game-right">
      <div class="story-strip" id="tut-story"></div>
      <div id="tut-shop"></div>
      <div id="tut-visual"></div>
    </div>

  </div>

  <div class="next-zone">
    <button class="btn-mega-next" id="btn-mega-next">
      <span id="btn-mega-label">Següent</span>
      <span class="mega-arrows">»</span>
    </button>
  </div>

</div>

<div id="fade-overlay"
     style="position:fixed;inset:0;background:#000;opacity:0;
            pointer-events:none;z-index:9999;transition:opacity 1.2s ease;"></div>

<script>
'use strict';

/* ================================================================
   VISUALS SVG
   ================================================================ */

/** Introducció: bitllet → ? (sense números, sense monedes) */
function svgIntro() {
  return `<svg viewBox="0 0 260 130" xmlns="http://www.w3.org/2000/svg"
          style="max-width:260px;width:100%;height:auto;display:block;margin:0 auto;">

    <!-- Bitllet (pagues) -->
    <rect x="14" y="30" width="80" height="54" rx="10"
          fill="#f0fdf4" stroke="#5a6a1e" stroke-width="2.5"/>
    <text x="54" y="52" text-anchor="middle"
          font-family="'Segoe UI',sans-serif" font-size="11"
          font-weight="600" fill="#64748b">Pagues</text>
    <text x="54" y="74" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="22"
          font-weight="800" fill="#1c1f0e">💵</text>

    <!-- Fletxa animada -->
    <line x1="104" y1="57" x2="148" y2="57"
          stroke="#5a6a1e" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <polygon points="150,57 142,51 142,63" fill="#5a6a1e">
      <animate attributeName="transform" attributeType="XML"
               type="translate" values="0,0;5,0;0,0" dur="1.4s" repeatCount="indefinite"/>
    </polygon>

    <!-- Canvi (?) -->
    <rect x="158" y="30" width="80" height="54" rx="10"
          fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="198" y="52" text-anchor="middle"
          font-family="'Segoe UI',sans-serif" font-size="11"
          font-weight="600" fill="#64748b">Canvi</text>
    <text x="198" y="76" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="28"
          font-weight="900" fill="#92400e">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      ?
    </text>

    <!-- Subtítol -->
    <text x="130" y="118" text-anchor="middle"
          font-family="'Segoe UI',sans-serif" font-size="11"
          font-weight="600" fill="#94a3b8">La botiga et torna la resta</text>
  </svg>`;
}


/**
 * svgVertical(a, b, result, isSum)
 * Operació en columna com es fa a Primària:
 *
 *   isSum = false (resta):    isSum = true (suma):
 *     1,00                      0,60
 *   − 0,80                    + 1,20
 *   ──────                    ──────
 *     0,20                      1,80
 */
function svgVertical(a, b, result, isSum = false) {
  const fmt2 = n => n.toFixed(2).replace('.', ',');
  const aStr = fmt2(a);
  const bStr = fmt2(b);
  const rStr = fmt2(result);

  const W = 180, FONT = 28, LINE_H = 42;
  const X_RIGHT = 160;
  const Y0 = 40;
  const Y1 = Y0 + LINE_H;
  const LINE_Y = Y1 + 18;
  const Y2 = LINE_Y + LINE_H - 8;
  const H  = Y2 + 24;

  const opColor  = isSum ? '#5a6a1e' : '#dc2626';
  const resColor = '#166534';
  const charW    = FONT * 0.62;

  // Amplada del resultat per la caixa
  const rW = rStr.length * charW + 20;
  const rX = X_RIGHT - rStr.length * charW - 10;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
           style="max-width:${W}px;width:100%;height:auto;display:block;margin:0 auto;">
    <text x="${X_RIGHT}" y="${Y0}" text-anchor="end"
          font-family="'Courier New',monospace" font-size="${FONT}"
          font-weight="700" fill="#1e293b">${aStr}</text>
    <text x="14" y="${Y1}" text-anchor="start"
          font-family="'Courier New',monospace" font-size="${FONT}"
          font-weight="700" fill="${opColor}">${isSum ? '+' : '−'}</text>
    <text x="${X_RIGHT}" y="${Y1}" text-anchor="end"
          font-family="'Courier New',monospace" font-size="${FONT}"
          font-weight="700" fill="${opColor}">${bStr}</text>
    <line x1="10" y1="${LINE_Y}" x2="${X_RIGHT + 6}" y2="${LINE_Y}"
          stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="${rX}" y="${LINE_Y + 4}" width="${rW}" height="${LINE_H - 2}"
          rx="8" fill="#f0fdf4" stroke="${resColor}" stroke-width="2">
      <animate attributeName="stroke-width" values="2;3.5;2" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <text x="${X_RIGHT}" y="${Y2}" text-anchor="end"
          font-family="'Courier New',monospace" font-size="${FONT}"
          font-weight="800" fill="${resColor}">${rStr}</text>
  </svg>`;
}


/* ================================================================
   HELPERS: mock de botiga
   ================================================================ */
function mockCard(emoji, nom, price, pulse = false) {
  const fmt = n => {
    if (Math.round(n*100)%100===0) return Math.round(n)+' €';
    return n.toFixed(2).replace('.',',') + ' €';
  };
  return `<div class="mock-card${pulse ? ' pulse' : ''}">
    <span class="mock-emoji">${emoji}</span>
    <span class="mock-nom">${nom}</span>
    <span class="mock-price">${fmt(price)}</span>
  </div>`;
}

function mockBill(amount, hidden = false) {
  const fmt = n => {
    if (Math.round(n*100)%100===0) return Math.round(n)+' €';
    return n.toFixed(2).replace('.',',') + ' €';
  };
  return `<div class="mock-bill${hidden ? ' hidden' : ''}">
    <span>💵</span>
    <span>Pagues amb ${fmt(amount)}</span>
  </div>`;
}

function mockAnswerRow(value, correct = false) {
  const cls = value !== null && correct ? 'mock-input correct' : 'mock-input';
  const display = value !== null ? value : '';
  return `<div class="mock-answer-wrap">
    <div class="${cls}">${display}</div>
    <span class="mock-unit">€</span>
    <button class="mock-ok" disabled>OK</button>
  </div>`;
}

function mockPrompt(text) {
  return `<div class="mock-prompt">${text}</div>`;
}

function mockStepDone(text) {
  return `<div class="mock-step-done">${text}</div>`;
}

/* ================================================================
   DADES DEL TUTORIAL
   ================================================================ */
const TUTORIAL = [

  /* ── INTRODUCCIÓ — la poma, dos passos ───────────────────────── */
  {
    steps: [
      /* intro-a: presentació sense resposta */
      {
        icon:      '💡',
        narration: 'Compres una cosa. Pagues amb <b>més diners</b> del que val. La botiga et torna la resta. Això és el <span class="g">canvi</span>.',
        story:     null,
        leftMain:  () => `
          ${mockCard('🍎', 'Poma', 0.60, true)}
          ${mockBill(1)}
          ${mockPrompt('Quant et torna?')}
          ${mockAnswerRow(null)}
        `,
        visual:    svgIntro,
      },
      /* intro-b: solució de la poma */
      {
        icon:      '✅',
        narration: `<b>1 − 0,60 = ?</b><br><br>
Fem la resta.<br><br>
1 − 0,60 = <span class="g">0,40</span><br><br>
Ja sabem que el canvi és <b>0,40 €</b>.`,
        story:     null,
        leftMain:  () => `
          ${mockCard('🍎', 'Poma', 0.60)}
          ${mockBill(1)}
          ${mockPrompt('Quant et torna?')}
          ${mockAnswerRow('0,40', true)}
        `,
        visual:    () => svgVertical(1, 0.60, 0.40, false),
      },
    ],
  },

  /* ── EXEMPLE 1: N1 — croissant ───────────────────────────────── */
  {
    steps: [
      /* 1a: presentació */
      {
        icon:      '🛒',
        narration: 'El croissant costa <b>0,80 €</b>. Pagues amb <b>1 €</b>. Quant et tornen?',
        story:     null,
        leftMain:  () => `
          ${mockCard('🥐', 'Croissant', 0.80, true)}
          ${mockBill(1)}
          ${mockPrompt('Quant et torna?')}
          ${mockAnswerRow(null)}
        `,
        visual:    null,
      },
      /* 1b: solució */
      {
        icon:      '✅',
        narration: `<b>1 − 0,80 = ?</b><br><br>
Fem la resta.<br><br>
1 − 0,80 = <span class="g">0,20</span><br><br>
Ja sabem que el canvi és <b>0,20 €</b>.`,
        story:     null,
        leftMain:  () => `
          ${mockCard('🥐', 'Croissant', 0.80)}
          ${mockBill(1)}
          ${mockPrompt('Quant et torna?')}

        visual:    () => svgVertical(1, 0.80, 0.20, false),

  /* ── EXEMPLE 2: N2 — llet ────────────────────────────────────── */
  {

5 − 1,30 = <span class="g">3,70</span><br><br>

        story:     null,

  },

  /* ── EXEMPLE 3: N3 — poma + llapis ──────────────────────────── */
  {
    steps: [
      /* 3a: presentació del total */
      {
        icon:      '🧮',
        narration: 'Tens <b>dos productes</b>. Pas 1: <span class="g">suma els dos preus</span>. Quant és el total?',
        story:     null,
        leftMain:  () => `
          <div class="mock-products-row">
            ${mockCard('🍎', 'Poma', 0.60, true)}
            <span class="mock-plus">+</span>
            ${mockCard('✏️', 'Llapis', 1.20, true)}
          </div>
          ${mockPrompt('Quant pagues en total?')}
          ${mockAnswerRow(null)}
        `,
        visual:    () => svgTwoSteps(0.60, 1.20, 1.80, 10, 8.20, false),
      },
      /* 3b: total resolt, ara demana canvi */
      {
        icon:      '✅',
        narration: `<b>0,60 + 1,20 = ?</b><br><br>
Fem la suma.<br><br>
0,60 + 1,20 = <span class="g">1,80</span><br><br>
Ara pagues amb <b>10 €</b>. Quant et tornen?`,
        story:     null,
        leftMain:  () => `
          <div class="mock-products-row">
            ${mockCard('🍎', 'Poma', 0.60)}

          </div>
          ${mockBill(10)}

      /* 3c: canvi resolt */

10 − 1,80 = <span class="g">8,20</span><br><br>
Ja sabem que el canvi és <b>8,20 €</b>.`,
        story:     null,
        leftMain:  () => `
          <div class="mock-products-row">
            ${mockCard('🍎', 'Poma', 0.60)}
            <span class="mock-plus">+</span>

          </div>
          ${mockBill(10)}
          ${mockStepDone('✅ Total: 1,80 €')}
          ${mockPrompt('Quant et torna?')}
          ${mockAnswerRow('8,20', true)}
        `,
        visual:    () => svgVertical(10, 1.80, 8.20, false),
      },
    ],
  },

];

const TOTAL_STEPS = TUTORIAL.reduce((n, ex) => n + ex.steps.length, 0);

/* ================================================================
   ESTAT
   ================================================================ */
let exIdx   = 0;
let stepIdx = 0;

/* ================================================================
   TIMER GLOBAL DEL PAS
   La barra comença a avançar des del primer instant del pas
   i representa el temps TOTAL (reveal + lectura).
   Quan arriba al 100%, avança automàticament.

   Temps total per pas: 15 000 ms
     · 0–3 000 ms   → spotlight esquerre (fase 1)
     · 3 000–8 000 ms → spotlight dret (fase 2)
     · 8 000–15 000 ms → tot il·luminat, lectura lliure
   ================================================================ */
const STEP_MS = 15000;
let timerElapsed = 0;
let timerLastMs  = null;
let timerIntv    = null;
let isPaused     = false;

function startTimer() {
  clearInterval(timerIntv);
  timerElapsed = 0; timerLastMs = Date.now();
  isPaused = false; _setPauseIcon(); _setFill(0);
  timerIntv = setInterval(_tick, 60);
}
function _tick() {
  if (isPaused) return;
  const now = Date.now();
  timerElapsed += now - timerLastMs;
  timerLastMs   = now;
  _setFill(Math.min(100, timerElapsed / STEP_MS * 100));
  if (timerElapsed >= STEP_MS) { clearInterval(timerIntv); _advance(); }
}
function _setFill(pct) {
  document.getElementById('timer-fill').style.width = pct + '%';
}
function togglePause() {
  if (isPaused) { isPaused = false; timerLastMs = Date.now(); }
  else          { isPaused = true; }
  _setPauseIcon();
}
function _setPauseIcon() {
  document.getElementById('btn-pause').textContent = isPaused ? '▶' : '⏸';
}

/* ================================================================
   NAVEGACIÓ
   ================================================================ */
function _globalStep() {
  let n = 0;
  for (let i = 0; i < exIdx; i++) n += TUTORIAL[i].steps.length;
  return n + stepIdx;
}

function _advance() {
  clearInterval(timerIntv);
  const ex         = TUTORIAL[exIdx];
  const isLastStep = stepIdx === ex.steps.length - 1;
  const isLastEx   = exIdx   === TUTORIAL.length  - 1;

  if (isLastStep && isLastEx) {
    const overlay = document.getElementById('fade-overlay');
    overlay.style.pointerEvents = 'all';
    overlay.style.opacity       = '1';
    setTimeout(() => { window.location.href = 'a-decimals.html'; }, 1200);
    return;
  }
  if (isLastStep) { exIdx++; stepIdx = 0; }
  else            { stepIdx++; }
  _transition();
}

function _transition() {
  clearInterval(timerIntv);
  const body = document.getElementById('game-body');
  body.classList.add('fading');
  setTimeout(() => {
    render();
    body.classList.remove('fading');
    setTimeout(() => {
      startTimer();       // barra des del primer moment
      _revealSequence();  // spotlights van per compte propi
    }, 600);
  }, 220);
}

/* ================================================================
   RENDER
   render()        → omple panell ESQUERRE (narrador) i header
   _renderRight()  → omple panell DRET (shop + visual), cridat a fase 2
   ================================================================ */
function render() {
  const ex   = TUTORIAL[exIdx];
  const step = ex.steps[stepIdx];
  const gs   = _globalStep();

  // Punts de progrés
  const dotsEl = document.getElementById('step-dots');
  let dotsHtml = '', gIdx = 0;
  TUTORIAL.forEach(e => {
    e.steps.forEach(() => {
      const cls = gIdx < gs ? 'done' : gIdx === gs ? 'current' : '';
      dotsHtml += `<div class="step-dot ${cls}" title="Pas ${gIdx+1} de ${TOTAL_STEPS}"></div>`;
      gIdx++;
    });
  });
  dotsEl.innerHTML = dotsHtml;

  // Panell dret: buit fins a la fase 2
  document.getElementById('tut-story').style.display = 'none';
  document.getElementById('tut-story').innerHTML     = '';
  document.getElementById('tut-shop').innerHTML      = '';
  const visEl = document.getElementById('tut-visual');
  visEl.style.transition = 'none';
  visEl.style.opacity    = '0';
  visEl.innerHTML        = '';

  // Narrador (panell esquerre) — invisible fins que _revealSequence l'activa
  const narBox = document.getElementById('narration-box');
  narBox.style.transition = 'none';
  narBox.style.opacity    = '0';
  document.getElementById('narration-text').innerHTML = step.narration;

  // Mega botó
  const isLastStep = stepIdx === ex.steps.length - 1;
  const isLastEx   = exIdx   === TUTORIAL.length  - 1;
  const btn = document.getElementById('btn-mega-next');
  const lbl = document.getElementById('btn-mega-label');
  if (isLastStep && isLastEx) {
    lbl.textContent = '🎮 Juga!';
    btn.className   = 'btn-mega-next btn-finish';
  } else {
    lbl.textContent = 'Següent';
    btn.className   = 'btn-mega-next';
  }
  btn.blur();
}

function _renderRight() {
  const step = TUTORIAL[exIdx].steps[stepIdx];

  // Story strip
  const storyEl = document.getElementById('tut-story');
  if (step.story) {
    storyEl.innerHTML     = step.story;
    storyEl.style.display = 'flex';
  } else {
    storyEl.style.display = 'none';
    storyEl.innerHTML     = '';
  }

  // Mock botiga
  document.getElementById('tut-shop').innerHTML = step.leftMain ? step.leftMain() : '';

  // Visual SVG
  const visEl = document.getElementById('tut-visual');
  visEl.style.transition = 'none';
  visEl.style.opacity    = '0';
  visEl.innerHTML = step.visual ? step.visual() : '';
}

/* ================================================================
   SEQÜÈNCIA DE REVELACIÓ: spotlight esquerre → dret → tot
   El timer ja corre des de _transition / arrencada.
   ================================================================ */
function _revealSequence() {
  const gl = document.getElementById('game-left');
  const gr = document.getElementById('game-right');

  gl.classList.remove('spotlight', 'dimmed');
  gr.classList.remove('spotlight', 'dimmed');

  // Fase 1 (0–3 s) — focus ESQUERRE: narrador apareix, dret buit i atenuat
  gl.classList.add('spotlight');
  gr.classList.add('dimmed');

  setTimeout(() => {
    const narBox = document.getElementById('narration-box');
    narBox.style.transition = 'opacity 0.45s ease';
    narBox.style.opacity    = '1';
  }, 300);

  // Fase 2 (3–8 s) — focus DRET: injectem contingut i el mostrem
  setTimeout(() => {
    gl.classList.remove('spotlight', 'dimmed');
    gr.classList.remove('spotlight', 'dimmed');
    gl.classList.add('dimmed');
    gr.classList.add('spotlight');

    _renderRight();
    setTimeout(() => {
      const visEl = document.getElementById('tut-visual');
      visEl.style.transition = 'opacity 0.5s ease';
      visEl.style.opacity    = '1';
    }, 200);
  }, 3000);

  // Fase 3 (8 s–) — tot il·luminat, lectura lliure
  setTimeout(() => {
    gl.classList.remove('spotlight', 'dimmed');
    gr.classList.remove('spotlight', 'dimmed');
  }, 8000);
}

/* ================================================================
   EVENTS
   ================================================================ */
document.getElementById('btn-mega-next').addEventListener('click', () => {
  clearInterval(timerIntv);
  _advance();
});
document.getElementById('btn-pause').addEventListener('click', togglePause);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    togglePause();
  }
});

/* ================================================================
   ARRENCADA
   ================================================================ */
render();
setTimeout(() => {
  startTimer();       // barra des del primer moment
  _revealSequence();
}, 600);
</script>
