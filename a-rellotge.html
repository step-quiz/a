<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rellotge d'agulles — versió adaptada per a diversitat">
    <link rel="icon" href="icon-green.png">
    <title>Rellotge</title>

    <!--
    ============================================================
    FITXER: a-rellotge.html
    ROL: Llegir el rellotge d'agulles, per a l'aula d'acollida. Sense frases.
    JAVASCRIPT: js/a-rellotge/a-rellotge.js (pantalla, teclat, punts),
         js/a-rellotge/generador.js (hores, lògica pura) i js/a-rellotge/vista.js
         (l'ajuda); motor comú a js/game-core.js.

    COM ES JUGA:
      · Es veu un rellotge d'agulles; s'escriu l'hora (H) i els minuts (MM) en dos camps.
        S'accepten les hores 13–23 (13 → 1). La rodeta «123» hi afegeix els números 1–12.
      · Botó 💡: el nivell 1 diu com es diu l'hora quan l'agulla llarga és al 12, al 3, al 6
        i al 9 («en punt», «i quart», «i mitja», «menys quart»); els nivells 2 i 3, què val
        cada número (de 5 en 5).
      · Si s'esgoten els intents, l'hora correcta surt als camps, en verd.

    NIVELLS (via ?nivell= o els botons de dalt a l'esquerra del rellotge):
      Nivell 1: quarts d'hora (els minuts són 0, 15, 30 o 45) (default)
      Nivell 2: intervals de 5 minuts
      Nivell 3: qualsevol minut (0–59), amb les ratlletes dels minuts
      ?numeros=1  el rellotge porta els números 1–12

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 6)
      ?maxintents=N       (default 5)
      ?fixed=A|B|C        Sessió fixa (js/fixed-sessions.js)
    ============================================================
    -->

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    6,
            defaultIntents:       5
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/accessibilitat.css">

    <style>
        /* ── PALETA VERDA ────────────────────────────────────────── */
        :root {
            --primary:       #5a6a1e;
            --primary-light: #e5e8c8;
            --primary-hover: #3d4a14;
            --primary-dark:  #1c1f0e;
        }
        h1         { margin-bottom: 2px; }
        .title-row { margin-bottom: 6px; }

        /* ── PANELL DEL RELLOTGE ─────────────────────────────────── */
        .resolution-panel {
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px 14px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }
        .clock-panel-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 28px;
        }
        .clock-wrap { display: flex; align-items: center; justify-content: center; padding: 2px; }
        #clock-svg  { filter: drop-shadow(0 4px 12px rgba(90,106,30,0.18)); display: block; }

        /* Selector de nivell (dalt a l'esquerra) i rodeta dels números (dalt a la dreta) */
        .btn-nivells { position: absolute; top: 0; left: 0; z-index: 10; display: flex; align-items: center; gap: 4px; }
        .btn-nivell {
            font-size: 0.62rem; font-weight: 700; color: var(--primary); background: white;
            border: 1.5px solid var(--primary); border-radius: 20px; padding: 4px 9px; cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.1s; touch-action: manipulation;
            white-space: nowrap; user-select: none; line-height: 1.3;
        }
        .btn-nivell:hover  { background: var(--primary-light); }
        .btn-nivell:active { transform: scale(0.96); }
        .btn-nivell.active { background: var(--primary); color: white; }
        .btn-toggle-nombres {
            position: absolute; top: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 5px;
            font-size: 0.7rem; font-weight: 700; color: var(--primary); background: var(--primary-light);
            border: 1.5px solid var(--primary); border-radius: 20px; padding: 4px 10px; cursor: pointer;
            transition: background 0.15s, transform 0.1s; touch-action: manipulation;
            white-space: nowrap; user-select: none; line-height: 1.3;
        }
        .btn-toggle-nombres:hover  { background: #d4d9a8; }
        .btn-toggle-nombres:active { transform: scale(0.96); }
        .btn-toggle-nombres .toggle-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; transition: background 0.2s; flex-shrink: 0; }
        .btn-toggle-nombres.active .toggle-dot { background: var(--primary); }

        /* ── CAMPS H:MM ──────────────────────────────────────────── */
        .inputs-wrap {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 2.4em; font-family: 'Courier New', Courier, monospace; font-weight: bold;
        }
        .inputs-wrap input[type="text"] {
            width: 72px; font-family: 'Courier New', Courier, monospace; font-size: 0.85em; font-weight: bold;
            padding: 10px 6px; text-align: center; border: 2px solid var(--border-heavy); border-radius: 8px;
            outline: none; background: white; color: #1e293b; transition: border-color 0.2s, background 0.2s;
        }
        .inputs-wrap input[type="text"]:focus,
        .inputs-wrap input[type="text"].kb-active-input { border-color: #5a6a1e; background: #eceee0; }
        /* Quan s'esgoten els intents, l'hora correcta surt als camps, en verd */
        .inputs-wrap input[type="text"].reveal { border-color: var(--success); background: #dcfce7; color: #166534; }
        .colon-sep { color: #475569; font-size: 1em; user-select: none; padding: 0 2px; line-height: 1; }

        /* ── BOTONS: OK + ajuda ──────────────────────────────────── */
        .action-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
        #btn-submit-val {
            font-size: 0.8rem; font-weight: 700; padding: 0; width: 2.4rem; height: 2.4rem;
            background-color: #cbd5e1; color: #334155; border-color: #94a3b8;
            transition: background-color 0.15s, color 0.15s; line-height: 1;
            display: inline-flex; align-items: center; justify-content: center;
        }
        #btn-submit-val:focus-visible { outline: 3px solid var(--primary); }
        #btn-submit-val:active        { transform: scale(0.95); }
        @media (hover: hover) {
            #btn-submit-val:hover { background-color: #5a6a1e; border-color: #3d4a14; color: white; }
        }
        #btn-submit-val.error-shake { background-color: var(--danger); border-color: var(--danger); color: white; animation: shake 0.2s; }
        .btn-ajuda {
            background: #fffbeb; color: #92400e; border: 2px solid #fbbf24; border-radius: 8px;
            padding: 7px 14px; font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: background 0.15s, transform 0.1s; touch-action: manipulation; white-space: nowrap;
        }
        .btn-ajuda:hover  { background: #fef3c7; }
        .btn-ajuda:active { transform: scale(0.96); }

        /* ── AJUDA: xifres i quatre expressions ──────────────────── */
        .help-text {
            display: none; background: #fffbeb; border: 2px solid #fde68a; border-radius: 10px;
            padding: 12px 24px; font-size: 1.1em; color: #78350f; font-weight: 600; text-align: center;
            width: fit-content; max-width: min(820px, 95%); line-height: 1.6; animation: fadeIn 0.25s ease;
        }
        .help-text.visible { display: block; }
        .aj-par   { font-family: 'Courier New', Courier, monospace; white-space: nowrap; margin: 0 6px; }
        .aj-par b { font-size: 1.15em; }
        .aj-text  { font-weight: 800; }
        .aj-taula { display: flex; flex-wrap: wrap; justify-content: center; }
        @media (max-width: 640px) { .help-text { max-width: 95%; } }

        /* ── MISSATGE DE FI DE PREGUNTA (sempre visible al viewport) ── */
        #mini-victory-overlay {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: auto; min-width: 200px; max-width: 90vw; border: 2px solid var(--border-color);
            border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.18); background: var(--bg-color);
            padding: 20px 32px; z-index: 500; animation: popUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popUp {
            from { transform: translateX(-50%) scale(0.7); opacity: 0; }
            to   { transform: translateX(-50%) scale(1);   opacity: 1; }
        }
        @keyframes attemptsBlink {
            0%, 100% { background-color: #fef3c7; border-color: #d1d5db; color: #334155; }
            50%       { background-color: #e5e7eb; border-color: #f59e0b; color: #334155; }
        }
        .attempts-counter.blink { animation: attemptsBlink 0.2s linear 5; }

        /* ── RESPONSIU ───────────────────────────────────────────── */
        @media (max-width: 480px) {
            .inputs-wrap       { font-size: 2em; }
            .inputs-wrap input { width: 62px; }
            .resolution-panel  { padding: 10px 14px 12px; gap: 8px; }
            .help-text         { font-size: 1em; padding: 10px 12px; }
        }
        @media (max-width: 350px) {
            .inputs-wrap { font-size: 1.7em; }
        }
    </style>
    <link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon-green.png" alt="Inici" onerror="this.style.display='none'">
    </a>
    <h1>Rellotge</h1>
</div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">

        <!-- Capçalera: Sessió | Repte X de Y | Intents -->
        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display"></div>
                <div class="level-row">
                    <div class="level-text" id="lvl-display"></div>
                </div>
            </div>
            <div id="attempts-display" class="attempts-counter"></div>
        </div>

        <div class="resolution-panel" id="resolution-panel">

            <!-- Rellotge SVG + rodeta dels números + selector de nivell -->
            <div class="clock-panel-wrap">
                <div class="btn-nivells" id="btn-nivells" role="group" aria-label="Nivell"></div>
                <button class="btn-toggle-nombres" id="btn-toggle-nombres"
                        onclick="toggleNombres()" aria-pressed="false" aria-label="Nombres">
                    <span class="toggle-dot" aria-hidden="true"></span>
                    123
                </button>
                <div class="clock-wrap">
                    <svg id="clock-svg" viewBox="0 0 200 200" width="228" height="228"
                         xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rellotge">
                        <circle cx="100" cy="100" r="88" fill="white" stroke="#5a6a1e" stroke-width="3.5"/>
                        <g id="clock-ticks"></g>
                        <g id="clock-numbers"></g>
                        <g transform="translate(100,100)">
                            <g id="min-hand" style="transform-origin:0 0;transition:transform 0.6s ease;">
                                <line x1="0" y1="6" x2="0" y2="-63" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
                            </g>
                            <g id="hour-hand" style="transform-origin:0 0;transition:transform 0.6s ease;">
                                <line x1="0" y1="8" x2="0" y2="-50" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
                            </g>
                        </g>
                        <circle cx="100" cy="100" r="5.5" fill="#1e293b"/>
                        <circle cx="100" cy="100" r="2.5" fill="#5a6a1e"/>
                    </svg>
                </div>
            </div>

            <!-- Camps H:MM -->
            <div class="inputs-wrap" id="inputs-wrap">
                <input type="text" id="input-hores" inputmode="numeric" maxlength="2"
                       aria-label="Hores" autocomplete="off">
                <span class="colon-sep">:</span>
                <input type="text" id="input-minuts" inputmode="numeric" maxlength="2"
                       aria-label="Minuts" autocomplete="off">
            </div>

            <!-- OK i ajuda -->
            <div class="action-row" id="action-row">
                <button class="btn-submit" id="btn-submit-val" onclick="checkAnswer()">OK</button>
                <button class="btn-ajuda" onclick="toggleHelp()" aria-label="Ajuda">💡</button>
            </div>

            <div class="help-text" id="help-text" aria-live="polite"></div>

        </div>

    </div>
    <!-- #mini-victory-overlay, #session-end-screen, #final-screen
         s'injecten via injectSharedHTML() de game-core.js -->
</div>

<script type="module" src="js/a-rellotge/a-rellotge.js"></script>
</body>
</html>
