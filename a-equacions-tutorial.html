<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial — Equacions</title>
  <style>
    :root {
      --primary:       #0d9488;
      --primary-light: #ccfbf1;
      --primary-dark:  #115e59;
      --var-color:     #134e4a;
      --var-bg:        #ccfbf1;
      --var-border:    #5eead4;
      --bg:            #f0fdfa;
      --panel:         #ffffff;
      --text:          #0f172a;
      --muted:         #64748b;
      --border:        #e2e8f0;
      --radius:        10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 14px 6px;
    }

    /* ── CAPÇALERA PÀGINA ─── */
    .title-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 7px;
      width: 100%; max-width: 920px;
      justify-content: center;
    }
    .title-row h1 {
      font-size: 1.25em; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--primary-dark);
    }
    .home-icon-link {
      width: 36px; height: 36px; opacity: 0.7;
      transition: opacity 0.2s; display: block; flex-shrink: 0;
    }
    .home-icon-link:hover { opacity: 1; }
    .home-icon-link img { width: 100%; height: 100%; object-fit: contain; }

    /* ── PANELL ─── */
    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      width: 100%; max-width: 920px;
      overflow: hidden;
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── CAPÇALERA TUTORIAL ─── */
    .tut-header {
      background: var(--primary-dark);
      color: white;
      padding: 8px 14px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }

    /* Punts de progrés visuals (substitueixen el % de text) */
    .step-dots {
      display: flex; gap: 6px; align-items: center;
      flex: 1;
    }
    .step-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      transition: background 0.4s ease, transform 0.4s ease;
      flex-shrink: 0;
    }
    .step-dot.done    { background: #5eead4; }
    .step-dot.current { background: white; transform: scale(1.55); }

    /* exemple-chip eliminat (punt 1) */

    /*
     * TODO-2: El botó de pausa hauria de ser molt més gran (mínim 48×48 px),
     * amb icona clara i potser una etiqueta visible "PAUSA",
     * de manera que alumnes amb TDAH o TEA el trobin immediatament
     * sense haver de buscar-lo ni llegir res.
     */
    .btn-pause {
      background: white; border: 2px solid #ea580c;
      color: #ea580c; font-size: 1.1em; font-weight: 800;
      width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: background 0.15s; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(234,88,12,0.2);
    }
    .btn-pause:hover { background: #fff7ed; }

    /* ── BARRA TIMER ─── */
    .timer-track { height: 5px; background: rgba(0,0,0,0.08); flex-shrink: 0; }
    .timer-fill  { height: 100%; background: linear-gradient(90deg,#f97316,#ea580c); width:0%; }

    /* ── COS PRINCIPAL ─── */
    .game-body {
      display: flex; flex-direction: row;
      flex: 1 1 0; min-height: 0;
      transition: opacity 0.22s ease;
    }
    .game-body.fading { opacity: 0; pointer-events: none; }

    /* ── PANELL ESQUERRE — narració (top) + equació algebraica ─── */
    .game-left {
      width: 42%; flex-shrink: 0;
      transition: width 0.3s ease;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 14px 14px 10px;
      border-right: 1px solid var(--border);
      overflow-y: auto; min-height: 0;
      gap: 14px;
      /*
       * TODO-3: Connectar visualment els dos panells.
       * Propostes: (a) línia puntejada animada que vagi de l'equació
       * al visual SVG del panell dret, (b) pols de color sincronitzat
       * als dos panells quan canvia el pas, (c) fletxa subtil a la vora
       * dreta de game-left que apunti sempre cap al visual.
       */
    }
    /* Wrapper per centrar verticalment l'equació en l'espai restant */
    .game-left-eq-wrap {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; width: 100%;
    }

    /* ── STORY STRIP — ara al panell DRET, sobre el visual ─── */
    /*
     * Mostra l'operació del pas en curs com a seqüència d'emojis
     * i símbols matemàtics. Pertany al panell gràfic (dret).
     */
    .story-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      row-gap: 6px;
      column-gap: 8px;
      padding: 10px 14px;
      background: var(--primary-light);
      border: 2px solid var(--var-border);
      border-radius: 14px;
      font-size: 1.65em;
      width: 100%;
      min-height: 62px;
      animation: stripIn 0.35s ease;
    }
    @keyframes stripIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .s-op {
      font-size: 0.58em; font-weight: 900;
      color: var(--primary-dark);
      background: white;
      border: 1.5px solid var(--var-border);
      border-radius: 8px;
      padding: 4px 9px; line-height: 1;
    }
    .s-op.red  { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }
    .s-op.blue { color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }
    .s-res {
      font-size: 0.68em; font-weight: 900;
      background: white;
      border: 2.5px solid var(--primary);
      border-radius: 10px;
      padding: 5px 11px;
      color: var(--primary-dark);
      font-family: 'Courier New', monospace;
      line-height: 1.2;
    }
    .s-x {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--var-bg);
      border: 2px solid var(--var-border);
      border-radius: 9px;
      width: 46px; height: 42px;
      font-size: 0.72em; font-weight: 900; font-style: italic;
      color: var(--var-color);
      font-family: 'Courier New', monospace;
    }
    .s-candy { font-size: 0.8em; line-height: 1.1; word-break: break-all; }
    .s-eq { font-size: 0.65em; font-weight: 900; color: var(--primary); padding: 0 2px; }

    /* ── EQUACIÓ MOCK ─── */
    .mock-eq {
      display: flex; align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 2.1em;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      flex-wrap: wrap;
    }
    .t-var {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 12px;
      background: var(--var-bg);
      border: 2px solid var(--var-border);
      border-radius: 10px;
      color: var(--var-color); line-height: 1;
    }
    .t-var .t-coeff { color: var(--var-color); }
    .t-var .t-dot   { color: #475569; font-size: 0.85em; }
    .t-var .t-x     { font-style: italic; }
    .t-num {
      padding: 7px 12px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      color: #334155; line-height: 1;
    }
    .t-op {
      background: #f1f5f9; border: 2px solid #cbd5e1;
      border-radius: 10px; padding: 7px 14px;
      color: #64748b; font-weight: bold;
    }
    .t-eq { color: var(--primary); font-weight: bold; padding: 0 4px; }

    .mock-answer-row {
      display: flex; align-items: center;
      justify-content: center; gap: 10px;
      font-size: 1.65em;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }
    .mock-x-label {
      font-style: italic;
      background: var(--var-bg);
      border: 2px solid var(--var-border);
      border-radius: 10px;
      padding: 6px 12px;
      color: var(--var-color); line-height: 1;
    }
    .mock-eq-sign { color: var(--primary); padding: 0 4px; }
    .mock-input {
      width: 85px; background: white;
      border: 2px solid #e2e8f0; border-radius: 8px;
      padding: 7px; text-align: center;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85em; font-weight: bold; color: #1e293b; line-height: 1;
    }
    .mock-input.correct { background: #f0fdf4; border-color: #22c55e; color: #475569; }
    .mock-btns { display: flex; gap: 10px; align-items: center; }
    .mock-ok {
      width: 2rem; height: 2rem;
      background: #cbd5e1; border: none; border-radius: 6px;
      font-weight: 700; font-size: 0.8rem; color: #334155;
      cursor: default;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── PANELL DRET: story strip (top) + visual SVG gran (resta) ─── */
    .game-right {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 10px 16px 8px;
      overflow-y: auto; min-height: 0;
      gap: 8px;
      background: linear-gradient(160deg, #fafffe 0%, #f0fdfa 100%);
    }
    /* El visual ocupa tot l'espai restant */
    #tut-visual {
      width: 100%;
      display: flex; justify-content: center; align-items: center;
      flex: 1; min-height: 0; flex-shrink: 0;
    }
    #tut-visual svg  { display: block; max-width: 100%; height: auto; }
    #tut-visual > div { max-width: 100%; }

    /* El story strip va a dalt del visual */
    .game-right .story-strip { flex-shrink: 0; }

    /* La narració és al fons del panell ESQUERRE — visible des del principi */
    .narration-box {
      width: 100%; background: white;
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex; align-items: flex-start; gap: 10px;
      flex-shrink: 0;
      /* opacity controlada per JS en _revealSequence */
    }
    .narration-icon { font-size: 1.3em; flex-shrink: 0; line-height: 1; margin-top: 1px; }
    .narration-text { font-size: 0.97em; line-height: 1.55; color: var(--text); }
    .narration-text b   { color: var(--primary-dark); }
    .narration-text .vx { color: var(--var-color); font-weight: 700; font-style: italic; }

    /* ── MEGA BOTÓ SEGÜENT — sempre visible, gran, animat ─── */
    .next-zone {
      padding: 9px 20px 11px;
      display: flex; justify-content: center; align-items: center;
      flex-shrink: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    .btn-mega-next {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 44px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white; border: none; border-radius: 50px;
      font-family: inherit; font-size: 1.3em; font-weight: 900;
      letter-spacing: 0.5px; cursor: pointer;
      box-shadow: 0 4px 24px rgba(13,148,136,0.38);
      animation: megaPulse 2.6s ease-in-out infinite;
      transition: transform 0.1s;
    }
    .btn-mega-next:active { transform: scale(0.95) !important; }
    .btn-mega-next:hover  { animation-play-state: paused; }
    .btn-mega-next.btn-finish {
      background: linear-gradient(135deg, #16a34a 0%, #14532d 100%);
      box-shadow: 0 4px 24px rgba(22,163,74,0.4);
    }
    .btn-mega-next.btn-ex {
      background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%);
      box-shadow: 0 4px 24px rgba(124,58,237,0.38);
    }
    /* Les dobles fletxes animen endavant */
    .mega-arrows {
      display: inline-flex;
      animation: arrowBounce 1.3s ease-in-out infinite;
      font-size: 1.1em;
    }
    @keyframes arrowBounce {
      0%, 100% { transform: translateX(0); }
      50%       { transform: translateX(5px); }
    }
    @keyframes megaPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 4px 24px rgba(13,148,136,0.38);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 6px 36px rgba(13,148,136,0.58),
                    0 0 0 8px rgba(13,148,136,0.10);
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SPOTLIGHT (focus seqüencial esquerra→dreta) ─── */
    .game-left, .game-right {
      transition: opacity 0.5s ease, box-shadow 0.5s ease;
    }
    .game-left.spotlight  { box-shadow: inset 0 0 0 3px var(--primary); background: #f8fffe; }
    .game-right.spotlight { box-shadow: inset 0 0 0 3px var(--primary); }
    .game-left.dimmed  { opacity: 0.06; }
    .game-right.dimmed { opacity: 0.06; }

    /* ── VISUAL ESQUERRE (per als passos 'resol' amb formula a l'esquerra) ─── */
    #tut-visual-left {
      width: 100%; display: none;
      justify-content: center; align-items: center;
      transition: opacity 0.55s ease;
    }
    #tut-visual-left > div { max-width: 100%; }

    /* ── RESPONSIVE ─── */
    @media (max-width: 680px) {
      body { overflow: auto; height: auto; padding: 6px; }
      .panel { flex: none; min-height: 560px; }
      .game-body { flex-direction: column; }
      .game-left, .game-right { width: 100%; border-right: none; }
      .game-left  { border-bottom: 1px solid var(--border); padding: 12px; justify-content: flex-start; }
      .game-right { padding: 10px; min-height: 220px; }
      .mock-eq    { font-size: 1.65em; }
      .story-strip { font-size: 1.35em; }
      .btn-mega-next { font-size: 1.15em; padding: 12px 32px; }
    }
    @media (max-width: 440px) {
      .title-row h1  { font-size: 0.95em; }
      .mock-eq       { font-size: 1.35em; }
      .story-strip   { font-size: 1.1em; }
      .btn-mega-next { font-size: 1em; padding: 11px 24px; }
    }
  </style>
<link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
  <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
    <img src="icon.png" alt="Inici" onerror="this.style.display='none'">
  </a>
  <h1>Tutorial — Equacions</h1>
</div>

<div class="panel">

  <div class="tut-header">
    <div class="step-dots" id="step-dots"></div>
    <button class="btn-pause" id="btn-pause" aria-label="Pausa/Repren">⏸</button>
  </div>

  <div class="timer-track">
    <div class="timer-fill" id="timer-fill"></div>
  </div>

  <div class="game-body" id="game-body">

    <!-- Esquerra: equació (centre) + narració (baix) -->
    <div class="game-left" id="game-left">
      <div class="game-left-eq-wrap">
        <div class="mock-eq"         id="tut-eq"></div>
        <div class="mock-answer-row" id="tut-answer" style="display:none;">
          <span class="mock-x-label">x</span>
          <span class="mock-eq-sign">=</span>
          <div  class="mock-input"   id="tut-input"></div>
        </div>
        <div class="mock-btns" id="tut-btns" style="display:none;"></div>
        <div id="tut-visual-left"></div>
      </div>
      <div class="narration-box" id="narration-box">
        <span class="narration-icon" id="narration-icon">👀</span>
        <div  class="narration-text" id="narration-text"></div>
      </div>
    </div>

    <!-- Dreta: story strip (emojis, top) + visual SVG gran -->
    <div class="game-right" id="game-right">
      <div class="story-strip" id="tut-story"></div>
      <div id="tut-visual"></div>
    </div>

  </div>

  <!-- MEGA BOTÓ SEGÜENT — sempre visible, gran i animat -->
  <div class="next-zone">
    <button class="btn-mega-next" id="btn-mega-next">
      <span id="btn-mega-label">Següent</span>
      <span class="mega-arrows">»</span>
    </button>
  </div>

</div>

<div id="fade-overlay"
     style="position:fixed;inset:0;background:#000;opacity:0;
            pointer-events:none;z-index:9999;transition:opacity 1.2s ease;"></div>

<script>
'use strict';

/* ================================================================
   VISUALS SVG
   ================================================================ */

/*
 * FIX TODO-6: el pas d'introducció ara té un visual SVG animat.
 * Una caixa gran amb un "?" parpellejant comunica intuïtivament
 * "hi ha un valor desconegut" sense necessitat de llegir res.
 */
function svgIntro() {
  return `<svg viewBox="0 0 210 175" xmlns="http://www.w3.org/2000/svg"
          style="max-width:210px;width:100%;height:auto;display:block;margin:0 auto;">
    <defs>
      <filter id="glow-i">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <!-- Ombra -->
    <rect x="52" y="28" width="114" height="104" rx="16"
          fill="rgba(13,148,136,0.10)" transform="translate(4,4)"/>
    <!-- Cos de la caixa -->
    <rect x="52" y="24" width="114" height="104" rx="16"
          fill="#ccfbf1" stroke="#0d9488" stroke-width="3"/>
    <!-- Obertura de la tapa -->
    <path d="M52,52 Q109,34 166,52" stroke="#0d9488" stroke-width="2.5"
          fill="none" stroke-linecap="round"/>
    <!-- ? parpellejant -->
    <text x="109" y="102" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="60"
          font-weight="900" fill="#115e59" font-style="italic"
          filter="url(#glow-i)">
      <animate attributeName="opacity"
               values="1;0.18;1;0.18;1" dur="2.5s" repeatCount="indefinite"/>
      ?
    </text>
    <!-- Tres puntets animats -->
    <circle cx="97"  cy="118" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0s"    repeatCount="indefinite"/>
    </circle>
    <circle cx="109" cy="118" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.28s" repeatCount="indefinite"/>
    </circle>
    <circle cx="121" cy="118" r="4" fill="#5eead4">
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.56s" repeatCount="indefinite"/>
    </circle>
    <!-- Etiqueta -->
    <text x="109" y="158" text-anchor="middle"
          font-family="'Segoe UI',sans-serif" font-size="13.5"
          font-weight="700" fill="#475569">x  =  ???</text>
  </svg>`;
}

/** Caixes animades: la x fa flip i apareix la solució (3·x = 12 → x=4) */
function svgBoxesAnim(a, sol) {
  const BW = 54, BH = 50, GAP = 12, PAD = 14;
  const W  = a * (BW + GAP) - GAP + PAD * 2;
  let boxes = '';
  for (let i = 0; i < a; i++) {
    const delay = (i * 340) + 'ms';
    boxes += `<div class="abx-box" style="animation-delay:${delay};">
      <span class="abx-x">x</span>
      <span class="abx-sol">${sol}</span>
    </div>`;
  }
  return `<style>
  .abx-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:${W+20}px;margin:0 auto;}
  .abx-row{display:flex;gap:${GAP}px;}
  .abx-box{position:relative;width:${BW}px;height:${BH}px;background:#ccfbf1;border:2.5px solid #0d9488;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 8px rgba(13,148,136,0.18);}
  .abx-x,.abx-sol{position:absolute;font-family:'Courier New',monospace;font-weight:800;font-size:1.4em;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  .abx-x  {color:#115e59;font-style:italic;}
  .abx-sol{color:#0d9488;}
  @keyframes abxFlip  {0%,32%{transform:translateY(0);opacity:1}44%,84%{transform:translateY(-115%);opacity:0}94%,100%{transform:translateY(0);opacity:1}}
  @keyframes abxReveal{0%,38%{transform:translateY(115%);opacity:0}50%,79%{transform:translateY(0);opacity:1}91%,100%{transform:translateY(115%);opacity:0}}
  .abx-box .abx-x  {animation:abxFlip   4.8s ease-in-out infinite;}
  .abx-box .abx-sol{animation:abxReveal 4.8s ease-in-out infinite;}
  .abx-total{font-size:.82em;font-weight:700;color:#475569;font-family:'Segoe UI',sans-serif;background:#f0fdfa;border:1.5px solid #99f6e4;border-radius:8px;padding:5px 14px;}
  </style>
  <div class="abx-wrap">
    <div class="abx-row">${boxes}</div>
    <div class="abx-total">🍬 Total: ${a * sol} caramels</div>
  </div>`;
}

/** Visual estàtic per a x + b = c */
function svgAdd(b, c) {
  const BW = 58, BH = 52, PAD = 10, GAP = 16;
  const W  = PAD*2 + BW*3 + GAP*4 + 10;
  const H  = BH + 32;
  const CY = 4 + BH / 2;
  const s  = [];
  s.push(`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"

/* ================================================================

   ================================================================ */
function xToken(coeff = 1) {
  if (coeff === 1)
    return `<span class="t-var"><span class="t-x">x</span></span>`;
  return `<span class="t-var"><span class="t-coeff">${coeff}</span><span class="t-dot">·</span><span class="t-x">x</span></span>`;
}
function numToken(n)  { return `<span class="t-num">${n}</span>`; }
function opToken(op)  { return `<span class="t-op">${op}</span>`; }
const EQ_SIGN = `<span class="t-eq">=</span>`;

/* ================================================================
   HELPERS DEL STORY STRIP
   Generen HTML visual (emojis + símbols) sense necessitat de text.
   ================================================================ */
function sX()             { return `<span class="s-x">x</span>`; }
function sOp(sym, v = '') { return `<span class="s-op ${v}">${sym}</span>`; }
function sEq()            { return `<span class="s-eq">=</span>`; }
function sRes(html)       { return `<span class="s-res">${html}</span>`; }
function sCandies(n) {
  if (n <= 7) return `<span class="s-candy">${'🍬'.repeat(n)}</span>`;
  return `<span class="s-res">🍬×${n}</span>`;
}
function sBoxes(n) {
  if (n <= 4) return '<span>📦</span>'.repeat(n);
  return `<span class="s-res">📦×${n}</span>`;
}
/* ================================================================

const TOTAL_STEPS = TUTORIAL.reduce((n, ex) => n + ex.steps.length, 0);

/* ================================================================
   ESTAT
   ================================================================ */
let exIdx   = 0;
let stepIdx = 0;

/* ================================================================
   TIMER (10 s per pas)
   ================================================================ */
const STEP_MS = 10000;
let timerElapsed = 0;
let timerLastMs  = null;
let timerIntv    = null;
let isPaused     = false;

function startTimer() {
  clearInterval(timerIntv);
  timerElapsed = 0; timerLastMs = Date.now();
  isPaused = false; _setPauseIcon(); _setFill(0);
  timerIntv = setInterval(_tick, 60);
}
function _tick() {
  if (isPaused) return;
  const now = Date.now();
  timerElapsed += now - timerLastMs;
  timerLastMs   = now;
  _setFill(Math.min(100, timerElapsed / STEP_MS * 100));
  if (timerElapsed >= STEP_MS) { clearInterval(timerIntv); _advance(); }
}
function _setFill(pct) {
  document.getElementById('timer-fill').style.width = pct + '%';
}
function togglePause() {
  if (isPaused) { isPaused = false; timerLastMs = Date.now(); }
  else          { isPaused = true; }
  _setPauseIcon();
}
function _setPauseIcon() {
  document.getElementById('btn-pause').textContent = isPaused ? '▶' : '⏸';
}

/* ================================================================
   NAVEGACIÓ
   ================================================================ */
function _globalStep() {
  let n = 0;
  for (let i = 0; i < exIdx; i++) n += TUTORIAL[i].steps.length;
  return n + stepIdx;
}

function _advance() {
  clearInterval(timerIntv);
  const ex         = TUTORIAL[exIdx];
  const isLastStep = stepIdx === ex.steps.length - 1;
  const isLastEx   = exIdx   === TUTORIAL.length  - 1;

  if (isLastStep && isLastEx) {
    const overlay = document.getElementById('fade-overlay');
    overlay.style.pointerEvents = 'all';
    overlay.style.opacity       = '1';
    setTimeout(() => { window.location.href = 'a-equacions.html'; }, 1200);
    return;
  }
  if (isLastStep) { exIdx++; stepIdx = 0; }
  else            { stepIdx++; }
  _transition();
}

function _transition() {
  const body = document.getElementById('game-body');
  body.classList.add('fading');
  setTimeout(() => {
    render();
    body.classList.remove('fading');
    setTimeout(() => { _revealSequence(); }, 600);
  }, 220);
}

/* ================================================================
   RENDER
   ================================================================ */
function render() {
  const ex   = TUTORIAL[exIdx];
  const step = ex.steps[stepIdx];
  const gs   = _globalStep();

  // Amplada panell esquerre dinàmica per pas
  document.getElementById('game-left').style.width = (step.leftPct ?? 42) + '%';

  // Centrat vertical panell dret: center quan no hi ha visual dret, flex-start amb visual
  const hasRightVisual = step.visual && !step.visualLeft;
  document.getElementById('game-right').style.justifyContent = hasRightVisual ? 'flex-start' : 'center';

  // Punts de progrés
  const dotsEl = document.getElementById('step-dots');
  let dotsHtml = '', gIdx = 0;
  TUTORIAL.forEach(e => {
    e.steps.forEach(() => {
      const cls = gIdx < gs ? 'done' : gIdx === gs ? 'current' : '';
      dotsHtml += `<div class="step-dot ${cls}" title="Pas ${gIdx+1} de ${TOTAL_STEPS}"></div>`;
      gIdx++;
    });
  });
  dotsEl.innerHTML = dotsHtml;

  // Chip eliminat (punt 1)
  // document.getElementById('example-chip').textContent = ex.chip;

  // Story strip — innerHTML per suportar 2 files de caramels
  const storyEl = document.getElementById('tut-story');
  if (step.story) {
    storyEl.innerHTML     = step.story;
    storyEl.style.display = 'flex';
  } else {
    storyEl.style.display = 'none';
    storyEl.innerHTML     = '';
  }

  // Narrador — visible o ocult segons el pas
  const narBox = document.getElementById('narration-box');
  if (step.narration) {
    narBox.style.transition = 'none';
    narBox.style.opacity    = '1';
    narBox.style.display    = '';
    document.getElementById('narration-icon').textContent = step.icon;
    document.getElementById('narration-text').innerHTML   = step.narration;
  } else {
    narBox.style.display = 'none';
  }

  // Equació mock
  document.getElementById('tut-eq').innerHTML = step.eq ? step.eq() : '';

  // Resposta
  const answerRow = document.getElementById('tut-answer');
  const inputEl   = document.getElementById('tut-input');
  if (step.answer !== null) {
    inputEl.textContent = step.answer;
    inputEl.className   = 'mock-input correct';
    answerRow.style.display = 'flex';
  } else {
    inputEl.textContent = '';
    inputEl.className   = 'mock-input';
    answerRow.style.display = step.showBtns ? 'flex' : 'none';
  }
  document.getElementById('tut-btns').style.display = step.showBtns ? 'flex' : 'none';

  // Visual SVG: panell dret (per defecte) o panell esquerre (visualLeft)
  const visRight = document.getElementById('tut-visual');
  const visLeft  = document.getElementById('tut-visual-left');
  visRight.style.transition = 'none'; visRight.style.opacity = '0';
  visLeft.style.transition  = 'none'; visLeft.style.opacity  = '0';
  if (step.visualLeft && step.visual) {
    visLeft.innerHTML        = step.visual();
    visLeft.style.display    = 'flex';
    visRight.innerHTML       = '';
    visRight.style.display   = 'none';
  } else if (step.visual) {
    visRight.innerHTML       = step.visual();
    visRight.style.display   = '';
    visLeft.innerHTML        = '';
    visLeft.style.display    = 'none';
  } else {
    visRight.innerHTML       = '';
    visRight.style.display   = 'none';
    visLeft.innerHTML        = '';
    visLeft.style.display    = 'none';
  }

  // Mega botó — sempre "Següent" excepte l'últim pas
  const isLastStep = stepIdx === ex.steps.length - 1;
  const isLastEx   = exIdx   === TUTORIAL.length  - 1;
  const btn = document.getElementById('btn-mega-next');
  const lbl = document.getElementById('btn-mega-label');
  if (isLastStep && isLastEx) {
    lbl.textContent = '🎮 Juga!';
    btn.className   = 'btn-mega-next btn-finish';
  } else {
    lbl.textContent = 'Següent';
    btn.className   = 'btn-mega-next';
  }
  btn.blur();
}

function _showVisual() {
  const step = TUTORIAL[exIdx].steps[stepIdx];
  const el = document.getElementById(step.visualLeft ? 'tut-visual-left' : 'tut-visual');
  el.style.transition = 'opacity 0.55s ease';
  el.style.opacity    = '1';
}

/*
 * Seqüència de revelació:
 *  - t=0s:   spotlight ESQUERRE (2s)
 *  - t=0.5s: apareix el visual
 *  - t=2s:   spotlight DRET (2s)
 *  - t=4s:   il·luminació completa + arrenca el timer
 */
function _revealSequence() {
  const step = TUTORIAL[exIdx].steps[stepIdx];
  const gl = document.getElementById('game-left');
  const gr = document.getElementById('game-right');

  // Neteja
  gl.classList.remove('spotlight', 'dimmed');
  gr.classList.remove('spotlight', 'dimmed');

  // Fase 1 — focus esquerre
  gl.classList.add('spotlight');
  gr.classList.add('dimmed');

  // Visual apareix a t=0.5s
  setTimeout(() => { _showVisual(); }, 500);

  // Fase 2 — focus dret
  setTimeout(() => {
    gl.classList.remove('spotlight', 'dimmed');
    gr.classList.remove('spotlight', 'dimmed');
    gl.classList.add('dimmed');
    gr.classList.add('spotlight');
  }, 2000);

  // Fase 3 — tot il·luminat + timer
  setTimeout(() => {
    gl.classList.remove('spotlight', 'dimmed');
    gr.classList.remove('spotlight', 'dimmed');
    if (step.narration2) {
      const box = document.getElementById('narration-box');
      box.style.transition = 'opacity 0.3s ease';
      box.style.opacity = '0';
      setTimeout(() => {
        document.getElementById('narration-text').innerHTML = step.narration2;
        box.style.opacity = '1';
      }, 300);
    }
    startTimer();
  }, 4000);
}

/* ================================================================
   EVENTS
   ================================================================ */
document.getElementById('btn-mega-next').addEventListener('click', () => {
  clearInterval(timerIntv);
  _advance();
});
document.getElementById('btn-pause').addEventListener('click', togglePause);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
    e.preventDefault();
    togglePause();
  }
});
