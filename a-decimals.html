<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diners i canvi — versió adaptada per a diversitat">
    <link rel="icon" href="icon-green.png">
    <title>Diners i canvi</title>

    <!--
    ============================================================
    FITXER: a-decimals.html
    ROL: Activitat de càlcul amb diners («Diners i canvi») per a l'aula
         d'acollida. Adaptació de l'activitat de decimals d'operacions.
    JAVASCRIPT: js/a-decimals/a-decimals.js (pantalla, teclat, punts),
         js/a-decimals/generador.js (compres i imports, lògica pura) i
         js/a-decimals/vista.js (l'HTML de cada peça); motor comú a js/game-core.js.

    COM ES LLEGEIX (poques paraules, a propòsit):
      · Cada producte és una targeta amb la imatge, el nom i el preu. El nom,
        «el bitllet», «total» i «canvi» són paraules del lèxic: es poden tocar
        per veure la targeta «Aprèn la paraula» (js/lexicon/).
      · Si la resposta no és bona, no hi ha cap frase: l'alumne veu la seva
        resposta partida en euros i cèntims, cada part amb ✔ o ✖ («3 ✔  ,06 ✖»).
      · Botó 💡: l'operació amb símbols («💶 5 € − 🥛 3,40 € = ?»).
      · Es pot escriure la coma o el punt; el punt no es penalitza.

    NIVELLS (via ?nivell=):
      Nivell 1: 1 producte. Preu = enter [1..4] + moneda gran (0,10/0,20/0,50).
                Ex: 2,50€, 3,10€. Sempre es paga amb 5€. Un pas: canvi.  (default)
      Nivell 2: 1 producte. Preu en passos de 0,10€ dins del rang del producte.
                Es paga amb 5€ o, un de cada tres cops, amb 10€. Un pas: canvi.
      Nivell 3: 2 productes. Preus en passos de 0,10€. Bitllet 10€.
                Dos passos: total → canvi.

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 4)
      ?maxintents=N       (default 5)
      ?fixed=A|B|C        Sessió fixa (js/fixed-sessions.js)
    ============================================================
    -->

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    4,
            defaultIntents:       5
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/accessibilitat.css">

    <style>
        /* ── PALETA VERDA (coherent amb a-enters / a-equacions) ── */
        :root {
            --bg-color:      #f8fafc;
            --primary:       #5a6a1e;
            --primary-light: #e5e8c8;
            --primary-hover: #3d4a14;
            --primary-dark:  #1c1f0e;
        }

        h1         { color: #1c1f0e; margin-bottom: 2px; }
        .title-row { margin-bottom: 6px; }
        .panel     { border-top-color: var(--primary); }

        /* ── BOTIGA: productes + bitllet ─────────────────────── */
        .shop-display {
            padding: 24px 20px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .products-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 14px 12px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            min-width: 100px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        /* El producte és una paraula del lèxic (js/lexicon/paraula.js): la imatge gran a sobre i el nom a sota,
           dins de la targeta. Es pot tocar (targeta «Aprèn la paraula»): només mostra la vora quan és nova o s'hi passa pel damunt. */
        .product-card .paraula {
            flex-direction: column;
            gap: 2px;
            padding: 4px 10px 2px;
            border: 2px solid transparent;
            border-radius: 12px;
            background: transparent;
        }
        .product-card .paraula-img  { font-size: 2.8em; }
        .product-card .paraula-text { font-size: 1em; color: #475569; font-weight: 600; }
        .product-card .paraula-nova { border-color: var(--paraula-destac, #f59e0b); }
        .product-price {
            font-size: 1.5em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #1e293b;
            white-space: nowrap;
        }

        .products-plus {
            font-size: 1.8em;
            font-weight: bold;
            color: #64748b;
            align-self: center;
        }

        .bill-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 12px;
            font-size: 1.15em;
            font-weight: 700;
            color: #166534;
        }
        .bill-amount {
            font-size: 1.3em;
            font-family: 'Courier New', Courier, monospace;
            white-space: nowrap;
        }

        /* ── PANELL DE RESOLUCIÓ ─────────────────────────────── */
        .resolution-panel {
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 24px 20px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        .step-done {
            color: var(--success);
            font-weight: 700;
            font-size: 1.1em;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .step-done .paraula   { color: #334155; }
        .step-done-val        { font-family: 'Courier New', Courier, monospace; font-weight: 800; margin-left: 0.2em; }

        /* La paraula del pas («total» o «canvi»): gran i ben visible */
        .step-prompt {
            font-size: 1.25em;
            font-weight: 700;
            color: #334155;
            text-align: center;
        }
        .step-prompt .paraula-img { font-size: 1.4em; }

        /* ── PAS: INPUT NUMÈRIC ──────────────────────────────── */
        .step-container { display: none; flex-direction: column; align-items: center; width: 100%; gap: 12px; animation: fadeIn 0.3s; }
        .step-container.active { display: flex; }

        /* Input + € + OK + ajuda en una sola fila (sense scroll vertical) */
        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 2em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        input[type="text"]#value-input {
            width: 130px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]#value-input:focus {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        /* Quan s'esgoten els intents, la resposta correcta surt dins del mateix camp, en verd */
        input[type="text"]#value-input.reveal {
            border-color: var(--success);
            background: #dcfce7;
            color: #166534;
        }

        .answer-unit {
            color: #475569;
            font-size: 0.8em;
        }

        /* ── BOTÓ OK (compacte, neutre) ──────────────────────── */
        #btn-submit-val {
            font-size: 0.75em;
            font-weight: 700;
            padding: 0;
            width: 2.6rem;
            height: 2.6rem;
            background-color: #cbd5e1;
            color: #334155;
            border-color: #94a3b8;
            transition: background-color 0.15s, color 0.15s;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        #btn-submit-val:focus-visible { outline: 3px solid var(--primary); }
        #btn-submit-val:active        { transform: scale(0.95); }
        @media (hover: hover) {
            #btn-submit-val:hover {
                background-color: var(--primary);
                border-color: var(--primary-dark);
                color: white;
            }
        }
        #btn-submit-val.error-shake {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: shake 0.2s;
        }

        /* ── BOTÓ 💡 AJUDA ───────────────────────────────────── */
        .btn-ajuda {
            background: #fffbeb;
            color: #92400e;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 0.65em;    /* relatiu al font-size 2em d'answer-row */
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-ajuda:hover  { background: #fef3c7; }
        .btn-ajuda:active { transform: scale(0.96); }

        /* L'ajuda: l'operació amb símbols («💶 5 € − 🥛 3,40 € = ?») */
        .help-text {
            display: none;
            background: #fffbeb;
            border: 2px solid #fde68a;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 1.15em;
            color: #78350f;
            font-weight: 600;
            text-align: center;
            max-width: min(860px, 95%);
            line-height: 1.7;
            animation: fadeIn 0.25s ease;
        }
        .help-text.visible { display: block; }
        .ajuda-img    { font-size: 1.4em; vertical-align: middle; }
        .ajuda-terme  { white-space: nowrap; font-family: 'Courier New', Courier, monospace; font-weight: 800; }
        .ajuda-op     { font-weight: 800; padding: 0 0.15em; }

        /* ── LES PARTS DE LA RESPOSTA (després d'una resposta equivocada) ──
         * Els euros i els cèntims, cadascun amb ✔ (bo) o ✖ (no): sense cap frase. */
        .part-feedback {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .part-feedback:empty { display: none; }
        .part {
            display: inline-flex;
            align-items: center;
            gap: 0.4em;
            padding: 2px 14px;
            border: 2px solid;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.6em;
            font-weight: 800;
            animation: fadeIn 0.2s ease;
        }
        .part.bo  { color: #166534; background: #f0fdf4; border-color: #86efac; }
        .part.mal { color: #b91c1c; background: #fef2f2; border-color: #fca5a5; }

        /* ── ANIMACIÓ BLINK INTENTS (feedback visual extra) ── */
        @keyframes attemptsBlink {
            0%, 100% { background-color: #fef3c7; border-color: #d1d5db; color: #334155; }
            50%       { background-color: #e5e7eb; border-color: #f59e0b; color: #334155; }
        }
        .attempts-counter.blink { animation: attemptsBlink 0.2s linear 5; }

        /* ── NIVELL BADGE A LA CAPÇALERA ─────────────────────── */
        .level-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .nivell-badge {
            font-size: 0.9em;
            color: var(--text-muted);
            font-weight: 600;
        }
        /* En pantalles estretes, el nivell es queda al costat del número de pregunta
           (amb el .level-text a tot l'ample, «· Nivell 1» es partia en tres línies) */
        @media (max-width: 480px) {
            .level-row { justify-content: center; }
            .level-row .level-text { width: auto; }
        }

        /* ── BOTÓ TUTORIAL ────────────────────────────────────── */
        .btn-tutorial {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            font-size: 0.9em;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .btn-tutorial:hover  { background: #d4d9a8; }
        .btn-tutorial:active { transform: scale(0.96); }

        .tut-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #dc2626;
            flex-shrink: 0;
            animation: tutDotPulse 0.8s ease-in-out 5;
            animation-fill-mode: forwards;
        }
        @keyframes tutDotPulse {
            0%, 100% { opacity: 1;   transform: scale(1); }
            50%      { opacity: 0.2; transform: scale(0.65); }
        }

        /* Overlay de transició cap al tutorial */
        #fade-overlay {
            position: fixed; inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        /* ── BOTÓ «NIVELL SEGÜENT» ───────────────────────────────
         * Només puja de nivell (mai baixa); el nivell 3 és el màxim i no el té. */
        #btn-next-level {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            font-size: 0.85em;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        #btn-next-level.visible { display: inline-flex; }
        @media (hover: hover) {
            #btn-next-level:hover { background: #d4d9a8; }
        }
        #btn-next-level:active { transform: scale(0.96); }
        @media (max-width: 480px) {
            #btn-next-level { width: 100%; justify-content: center; }
        }

        /* ── RESPONSIU ────────────────────────────────────────── */
        @media (max-width: 480px) {
            .shop-display     { padding: 16px 12px 12px; gap: 10px; }
            .product-card     { padding: 6px 10px 10px; min-width: 85px; }
            .product-card .paraula-img { font-size: 2.2em; }
            .product-price    { font-size: 1.3em; }
            .answer-row       { font-size: 1.6em; }
            input[type="text"]#value-input { width: 110px; padding: 10px; }
            .resolution-panel { padding: 16px 14px 18px; gap: 12px; }
            .step-prompt      { font-size: 1.1em; }
            .help-text        { font-size: 1.05em; padding: 10px 14px; }
            .part             { font-size: 1.4em; }
        }
        @media (max-width: 350px) {
            .product-card .paraula-img { font-size: 1.8em; }
            .product-card { min-width: 75px; padding: 4px 8px 8px; }
        }
    </style>
    <link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<!-- Títol + botó Tutorial -->
<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon-green.png" alt="Inici" onerror="this.style.display='none'">
    </a>
    <h1>Diners i canvi</h1>
    <button class="btn-tutorial" id="btn-tutorial" aria-label="Veure tutorial">
        <span class="tut-dot" aria-hidden="true"></span>
        Tutorial
    </button>
</div>

<!-- Overlay de transició cap al tutorial -->
<div id="fade-overlay"></div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">

        <!-- Capçalera: Sessió | [Compra X de Y · Nivell N] | Punts | Nivell següent | Intents -->
        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display"></div>
                <div class="level-row">
                    <div class="level-text"   id="lvl-display"></div>
                    <div class="nivell-badge" id="nivell-display"></div>
                </div>
            </div>
            <div class="score-text" id="score-display"></div>
            <!-- Botó per pujar de nivell (mai baixar). El nivell 3 és el màxim. -->
            <button id="btn-next-level"></button>
            <div id="attempts-display" class="attempts-counter"></div>
        </div>

        <!-- Botiga: els productes amb el seu preu i el bitllet -->
        <div class="shop-display" id="shop-display"></div>

        <!-- Panell de resolució -->
        <div class="resolution-panel" id="resolution-panel">

            <!-- Passos ja fets (nivell 3: el total) -->
            <div id="steps-done"></div>

            <!-- Pas actiu -->
            <div class="step-container active" id="step-active">
                <!-- La paraula del pas: «total» o «canvi» -->
                <div class="step-prompt" id="step-prompt"></div>

                <!-- Input + € + OK + ajuda en una sola fila -->
                <div class="answer-row" id="answer-row">
                    <input type="text" id="value-input" autocomplete="off"
                           aria-label="Escriu la resposta" aria-describedby="step-prompt">
                    <span class="answer-unit">€</span>
                    <button class="btn-submit" id="btn-submit-val" onclick="checkValue()">OK</button>
                    <button class="btn-ajuda" onclick="toggleHelp()" aria-label="Ajuda">💡</button>
                </div>

                <!-- Les parts de la resposta equivocada: euros i cèntims, amb ✔ o ✖ -->
                <div class="part-feedback" id="part-feedback" aria-live="polite"></div>

                <!-- L'ajuda: l'operació amb símbols -->
                <div class="help-text" id="help-text" aria-live="polite"></div>
            </div>

        </div>

    </div>
    <!-- #mini-victory-overlay, #session-end-screen, #final-screen
         s'injecten via injectSharedHTML() de game-core.js -->
</div>

<script type="module" src="js/a-decimals/a-decimals.js"></script>
</body>
</html>
