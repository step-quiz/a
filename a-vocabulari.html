<!doctype html>
<html lang="ca">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Vocabulari — versió adaptada per a diversitat" />
        <link rel="icon" href="icon-green.png" />
        <title>Vocabulari</title>

        <!--
    ============================================================
    FITXER: a-vocabulari.html
    ROL: «Vocabulari»: aprendre i practicar, en català, el nom de les coses que
         es poden dibuixar (les paraules amb imatge del lèxic: js/lexicon/dades.js).
         Sense frases; adaptació, amb el lèxic d'a2, de vocabulari.html d'operacions.
    JAVASCRIPT: js/a-vocabulari/a-vocabulari.js (pantalla i punts),
         generador.js (el banc de paraules, les preguntes i la comprovació, lògica
         pura) i vista.js (la imatge i les lletres); motor comú a js/game-core.js.

    NIVELLS (via ?nivell=):
      Nivell 1: una imatge → triar la paraula (4 opcions, amb article).  (default)
      Nivell 2: una paraula → triar la imatge (4 opcions).
      Nivell 3: una imatge → escriure la paraula. S'accepta amb o sense l'article («la poma»
                o «poma») i sense el punt volat («parallelogram»). Una errada petita
                (un accent, una lletra equivocada, de més o que falta, dues lletres
                girades, les paraules d'un terme en un altre ordre o una paraula que
                falta) no costa cap intent: la paraula surt lletra a lletra (✔ bona, ´ la
                lletra bona però amb un altre accent, ✖ equivocada o que falta, ⇄ dues
                lletres o dues paraules que van al revés) i es pot corregir; una errada
                de debò costa un intent. Una barra amb les lletres amb accent ajuda a
                escriure-les. No es demana escriure cap solució llarga (de més de 14
                caràcters, com «propietat commutativa»): als nivells 1 i 2 hi surten tots.

    PARÀMETRES PROPIS (via URL):
      ?tema=botiga        només les paraules d'un tema del lèxic (escola, animals,
                          natura, menjar, transport, casa, botiga, edifici…)
      ?vistes=1           només les paraules que l'alumne ja ha obert amb «Aprèn la paraula»

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 8)
      ?maxintents=N       (default 2)
      ?fixed=A|B|C        Sessió fixa (js/fixed-sessions.js)
    ============================================================
    -->

        <script>
            window.APP_CONFIG = {
                defaultSessions: 1,
                defaultOperations: 8,
                defaultIntents: 2,
            };
        </script>
        <link rel="stylesheet" href="css/tokens.css" />
        <link rel="stylesheet" href="css/shared.css" />
        <link rel="stylesheet" href="css/accessibilitat.css" />

        <style>
            /* ── PALETA VERDA ────────────────────────────────────────── */
            :root {
                --primary: #5a6a1e;
                --primary-light: #e5e8c8;
                --primary-hover: #3d4a14;
                --primary-dark: #1c1f0e;
            }
            h1 {
                color: #1c1f0e;
                margin-bottom: 2px;
            }
            .title-row {
                margin-bottom: 6px;
            }
            .panel {
                border-top-color: var(--primary);
            }
            .album-link {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 44px;
                min-height: 44px;
                font-size: 1.6rem;
                text-decoration: none;
            }
            .level-row {
                display: flex;
                align-items: baseline;
                gap: 8px;
            }
            .nivell-badge {
                font-size: 0.9em;
                color: var(--text-muted);
                font-weight: 600;
            }
            @media (max-width: 480px) {
                .level-row {
                    justify-content: center;
                }
                .level-row .level-text {
                    width: auto;
                }
            }

            /* ── EL NOMBRE I LES OPCIONS ─────────────────────────────── */
            .game-body {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 18px;
                padding: 22px 16px 26px;
            }
            #question-prompt {
                display: flex;
                justify-content: center;
            }
            .img-paraula {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 5.5rem;
                line-height: 1;
            }
            .img-paraula .pict {
                width: 1.5em;
                height: 1.5em;
            }
            .paraula-gran {
                padding: 10px 30px;
                font-size: 2.6em;
                font-weight: 800;
                color: var(--primary-dark);
                background: var(--primary-light);
                border: 3px solid var(--primary);
                border-radius: 16px;
            }

            /* ── OPCIONS ─────────────────────────────────────────────── */
            .options-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 12px;
                width: 100%;
                max-width: 460px;
            }
            .btn-option {
                min-height: 56px;
                padding: 10px 12px;
                font-size: 1.5em;
                font-weight: 700;
                color: #1e293b;
                background: #ffffff;
                border: 2px solid var(--border-heavy);
                border-radius: 12px;
                cursor: pointer;
                transition:
                    background 0.15s,
                    border-color 0.15s,
                    transform 0.1s;
                touch-action: manipulation;
            }
            .options-grid.amb-imatges {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .amb-imatges .btn-option {
                min-height: 110px;
            }
            .amb-imatges .img-paraula {
                font-size: 3.6rem;
            }
            .btn-option:focus-visible {
                outline: 3px solid var(--primary);
                outline-offset: 2px;
            }
            @media (hover: hover) {
                .btn-option:not(:disabled):hover {
                    background: var(--primary-light);
                    border-color: var(--primary);
                }
            }
            .btn-option:active:not(:disabled) {
                transform: scale(0.97);
            }
            .btn-option.correct {
                background: #dcfce7;
                border-color: var(--success);
                color: #166534;
            }
            .btn-option.wrong::after {
                content: ' ✖';
            }
            .btn-option.correct::after {
                content: ' ✔';
            }
            .btn-option.wrong {
                background: var(--danger-light);
                border-color: var(--danger);
                color: #b91c1c;
                animation: shake 0.2s;
            }
            .btn-option.reveal-answer {
                background: #dcfce7;
                border-color: var(--success);
                color: #166534;
                box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.35);
            }
            .btn-option:disabled {
                cursor: default;
            }

            @keyframes attemptsBlink {
                0%,
                100% {
                    background-color: #fef3c7;
                    border-color: #d1d5db;
                    color: #334155;
                }
                50% {
                    background-color: #e5e7eb;
                    border-color: #f59e0b;
                    color: #334155;
                }
            }
            .attempts-counter.blink {
                animation: attemptsBlink 0.2s linear 5;
            }

            @media (max-width: 480px) {
                .game-body {
                    padding: 14px 10px 18px;
                }
                .img-paraula {
                    font-size: 4.4rem;
                }
                .paraula-gran {
                    font-size: 2.1em;
                }
                .amb-imatges .img-paraula {
                    font-size: 3rem;
                }
                .btn-option {
                    font-size: 1.3em;
                }
            }
            /* ── ESCRIURE LA PARAULA (nivell 3) ──────────────────────── */
            .write-area[hidden],
            .options-grid[hidden] {
                display: none;
            }
            .write-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                width: 100%;
            }
            .write-row {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            #value-input {
                width: 260px;
                max-width: 70vw;
                padding: 10px 12px;
                font-size: 1.6em;
                font-weight: 700;
                text-align: center;
                border: 2px solid var(--border-heavy);
                border-radius: 10px;
            }
            #value-input:focus {
                border-color: var(--primary);
                background: var(--primary-light);
                outline: none;
            }
            #value-input.reveal {
                border-color: var(--success);
                background: #dcfce7;
                color: #166534;
            }
            .btn-ok {
                min-width: 56px;
                min-height: 48px;
                font-size: 1.1em;
                font-weight: 700;
                color: #fff;
                background: var(--primary-dark);
                border: none;
                border-radius: 10px;
                cursor: pointer;
                touch-action: manipulation;
            }
            .write-area.error-shake .write-row {
                animation: shake 0.2s;
            }
            .accents-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                justify-content: center;
                max-width: 460px;
            }
            .btn-accent {
                min-width: 44px;
                min-height: 44px;
                font-size: 1.3em;
                font-weight: 700;
                color: var(--primary-dark);
                background: #fff;
                border: 2px solid var(--border-heavy);
                border-radius: 8px;
                cursor: pointer;
                touch-action: manipulation;
            }
            .part-feedback {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                justify-content: center;
            }
            .part-feedback:empty {
                display: none;
            }
            .lletra {
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                min-width: 1.6em;
                padding: 2px 6px;
                font-size: 1.6em;
                font-weight: 800;
                line-height: 1.1;
                border: 2px solid;
                border-radius: 8px;
            }
            .lletra i {
                font-size: 0.55em;
                font-style: normal;
            }
            .lletra.bo {
                color: #166534;
                background: #f0fdf4;
                border-color: #86efac;
            }
            .lletra.accent {
                color: #92400e;
                background: #fffbeb;
                border-color: #fcd34d;
            }
            .lletra.mal {
                color: #b91c1c;
                background: #fef2f2;
                border-color: #fca5a5;
            }
            .lletra.creuada {
                color: #1e40af;
                background: #eff6ff;
                border-color: #93c5fd;
            }

            /* Botó «Nivell següent» (només puja; el 4 és el màxim) */
            #btn-next-level {
                display: none;
                align-items: center;
                gap: 5px;
                padding: 5px 12px;
                font-size: 0.85em;
                font-weight: 700;
                color: var(--primary);
                background: var(--primary-light);
                border: 2px solid var(--primary);
                border-radius: 20px;
                cursor: pointer;
                white-space: nowrap;
                touch-action: manipulation;
            }
            #btn-next-level.visible {
                display: inline-flex;
            }
            @media (max-width: 480px) {
                #btn-next-level {
                    width: 100%;
                    justify-content: center;
                }
            }
        </style>
        <link rel="stylesheet" href="css/chromebook.css" />
    </head>
    <body>
        <div class="title-row">
            <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
                <img src="icon-green.png" alt="Inici" onerror="this.style.display = 'none'" />
            </a>
            <h1>Vocabulari</h1>
            <a href="album.html" class="album-link" title="Àlbum de paraules" aria-label="Àlbum de paraules">📒</a>
        </div>

        <div class="panel" id="main-panel">
            <div id="game-screen" style="display: none">
                <!-- Capçalera: Sessió | Repte X de Y · Nivell | Punts | Intents -->
                <div class="header-info">
                    <div class="header-left">
                        <div class="session-text" id="session-display"></div>
                        <div class="level-row">
                            <div class="level-text" id="lvl-display"></div>
                            <div class="nivell-badge" id="nivell-display"></div>
                        </div>
                    </div>
                    <div class="score-text" id="score-display"></div>
                    <button id="btn-next-level"></button>
                    <div id="attempts-display" class="attempts-counter"></div>
                </div>

                <div class="game-body">
                    <!-- La imatge (nivells 1 i 3) o la paraula (nivell 2) -->
                    <div id="question-prompt"></div>
                    <!-- Les 4 opcions (nivells 1 i 2) -->
                    <div id="options-container" class="options-grid"></div>
                    <!-- Escriure la paraula (nivell 3) -->
                    <div class="write-area" id="write-area" hidden>
                        <div class="write-row">
                            <input type="text" id="value-input" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Escriu la resposta" />
                            <button type="button" class="btn-ok" onclick="checkWritten()">OK</button>
                        </div>
                        <div class="accents-bar" id="accents-bar"></div>
                        <div class="part-feedback" id="part-feedback" aria-live="polite"></div>
                    </div>
                </div>
            </div>
            <!-- #mini-victory-overlay, #session-end-screen, #final-screen
         s'injecten via injectSharedHTML() de game-core.js -->
        </div>

        <script type="module" src="js/a-vocabulari/a-vocabulari.js"></script>
    </body>
</html>
