    const BASE_URL = new URL('.', window.location.href).href;

    // `yt`: pàgina del tutorial (s'obre amb el botó «Tutorial»); buida si no n'hi ha cap per oferir.
    // El tutorial del rellotge no s'ofereix: l'activitat el té amagat a propòsit.
    // `fixed: true`: l'activitat admet sessions fixes (?fixed=A/B/C: tota la classe fa les mateixes
    // preguntes). Només les que ja van amb el motor nou (mòduls ES); tests/check-repo.js ho vigila.

      { file: 'a-rellotge.html',         label: "Rellotge d'agulles",        yt: '', fixed: true },
      { file: 'a-enters.html',           label: 'Nombres enters',            yt: 'a-enters-tutorial.html', fixed: true },
      { file: 'a-decimals.html',         label: 'Diners i canvi (decimals)', yt: 'a-decimals-tutorial.html', fixed: true },
      { file: 'a-proporciodirecta.html', label: 'Proporció directa',         yt: 'a-proporciodirecta-tutorial.html', fixed: true },
      { file: 'a-equacions.html',        label: 'Equacions de 1r grau',      yt: 'a-equacions-tutorial.html', fixed: true },

  <style>
    :root {
      --text-main: #2e2f1e;
      --text-muted: #6b6e4a;
      --bg-body: #f5f4ec;
      --eso-bg: #eceee0;
      --math-title: #5a6a1e;
      --border-heavy: #b8be8a;
      --panel-w: 384px;
      --accent: #5a6a1e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-body);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    /* El contingut queda centrat a l'espai que deixa el peu, que va sempre al final (mai fixat sobre el contingut). */
    .page { margin-block: auto; width: 100%; padding: 10px; display: flex; flex-direction: column; align-items: center; }

    .title-container { text-align: center; margin-bottom: 20px; }
    .title-row-1 { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 36px; font-weight: 800; color: #1c1f0e; margin: 0; }
    .title-row-2 { font-size: 24px; font-weight: 400; color: var(--math-title); margin-top: -15px; }
    .inline-icon { height: 82px; opacity: 0; animation: icon-slide-brake 0.6s cubic-bezier(0.1, 1.0, 0.2, 1.0) 0.1s forwards; }
    .text-step { opacity: 0; animation: fade-in 0.43s ease-out 0.6s forwards; }
    .title-row-2 { opacity: 0; animation: fade-in 0.24s ease-out 1.50s forwards; }

    @keyframes icon-slide-brake { from { transform: translateX(-60px) scale(0.8); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .main-wrapper { display: flex; gap: 30px; justify-content: center; width: 100%; max-width: 1000px; align-items: flex-start; }
    .quiz-panel { width: var(--panel-w); max-width: 100%; padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-heavy); }
    #panel-eso { background-color: var(--eso-bg); opacity: 0; animation: fade-in 0.24s ease-out 1.50s forwards; }

    h2 { margin: 0 0 10px 5px; font-size: 22px; font-weight: 800; color: #1c1f0e; }

    /* L'enllaç a les targetes imprimibles, sota del generador d'enllaços */
    .recursos { margin: 18px 0 4px; text-align: center; }
    .recursos a {
      display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px;
      font-size: 15px; font-weight: 700; color: var(--accent); text-decoration: none;
      background: var(--eso-bg); border: 1px solid var(--border-heavy); border-radius: 22px;
    }
    .recursos a:hover { background: #d4d9a8; }

    .row { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 10px; padding: 4px 8px; }
    .row label { font-size: 14px; font-weight: 600; text-align: left; }

    select {
      appearance: none; background-color: #ffffff; height: 32px; padding: 0 10px;
      font-size: 16px; border: 1px solid var(--border-heavy); border-radius: 6px;   /* 16 px: iOS no fa zoom en tocar-lo */
      cursor: pointer; text-align: center; width: 100%; transition: background-color 0.2s;
    }
    select:hover { background-color: #d4d9a8; }

    /* ── CUSTOM DROPDOWN ── */
    .cd-wrap { position: relative; width: 100%; font-size: 16px; user-select: none; }

    .cd-trigger {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      height: 32px; padding: 0 10px; background: #fff;
      border: 1px solid var(--border-heavy); border-radius: 8px;
      cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-main);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .cd-trigger:hover { border-color: #9aa45a; background: #e5e8c8; }
    .cd-wrap.open .cd-trigger { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,106,30,0.15); background: #fff; }

    .cd-chevron {
      flex-shrink: 0; width: 15px; height: 15px; color: var(--text-muted);
      transition: transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .cd-wrap.open .cd-chevron { transform: rotate(180deg); }

    .cd-list {
      position: absolute; top: calc(100% + 5px); left: 0; right: 0;
      background: #fff; border: 1px solid var(--border-heavy); border-radius: 10px;
      box-shadow: 0 8px 30px -4px rgba(28,31,14,0.12), 0 2px 8px -2px rgba(28,31,14,0.08);
      z-index: 999; overflow-y: auto; max-height: 260px; padding: 4px;
      transform-origin: top center;
      transform: scaleY(0.92) translateY(-4px); opacity: 0; pointer-events: none;
      transition: transform 0.18s cubic-bezier(0.4,0,0.2,1), opacity 0.18s cubic-bezier(0.4,0,0.2,1);
    }
    .cd-wrap.open .cd-list { transform: scaleY(1) translateY(0); opacity: 1; pointer-events: auto; }

    .cd-option {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 6px; cursor: pointer;
      font-size: 16px; color: var(--text-main); transition: background 0.1s;
    }
    .cd-option:hover, .cd-option.active { background: #eceee0; }
    .cd-option.active { box-shadow: inset 0 0 0 2px var(--accent); }
    .cd-option.selected { font-weight: 600; color: var(--accent); background: #eceee0; }
    .cd-check { width: 13px; height: 13px; flex-shrink: 0; color: var(--accent); opacity: 0; }
    .cd-option.selected .cd-check { opacity: 1; }

    /* Link block */
    .link-block { margin-top: 5px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.08); padding-inline: 5px; }
    .link-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; margin-bottom: 4px; display: block; }
    .link-output { width: 100%; min-height: 45px; height: 45px; font-family: monospace; font-size: 11px; padding: 8px; border-radius: 6px; border: 1px solid var(--border-heavy); background: #d4d9a8; word-break: break-all; user-select: all; -webkit-user-select: all; cursor: text; line-height: 1.3; display: flex; align-items: center; }

    .btn-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    .copy-btn, .open-btn, .help-btn { height: 38px; cursor: pointer; border-radius: 6px; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; border: none; gap: 6px; transition: all 0.2s ease; }
    .copy-btn { flex: 0.8; background: #ffffff; color: var(--text-main); border: 1px solid var(--border-heavy); }
    .help-btn { flex: 0.9; background: #ffffff; color: var(--text-main); border: 1px solid var(--border-heavy); }
    .open-btn { flex: 1.25; background: var(--accent); color: white; }
    .copy-btn:hover, .help-btn:hover { background-color: #d4d9a8; border-color: #9aa45a; }
    .open-btn:hover { background: #3d4a14; }

    .copy-status { font-size: 13px; color: #5a6a1e; margin-top: 0px; min-height: 0px; font-weight: 700; text-align: center; }

    .help-btn { display: none; }

    /* Focus visible amb teclat (el selector d'activitat, els botons, els enllaços…) */
    button:focus-visible, select:focus-visible, a:focus-visible,
    .cd-trigger:focus-visible, .link-output:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Peu: dins el flux de la pàgina, amb la icona de Step Quiz com un element més (no flotant) */
    .site-footer {
      width: 100%; background: var(--bg-body); border-top: 1px solid var(--border-heavy);
      padding: 10px; display: flex; align-items: center; justify-content: center;
      gap: 6px 15px; flex-wrap: wrap; text-align: center; font-size: 0.85em; color: var(--text-main);
    }
    .site-footer a { color: inherit; text-decoration: underline; white-space: nowrap; }
    .footer-logo {
      flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%;
      background: var(--eso-bg); border: 2px solid var(--border-heavy);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center;
      opacity: 0.8; transition: opacity 0.2s, transform 0.2s;
    }
    .footer-logo:hover, .footer-logo:focus-visible { opacity: 1; transform: scale(1.2); }
    .footer-logo img { width: 28px; height: 28px; object-fit: contain; }

    @media (max-width: 480px) {
      .title-container { margin-bottom: 10px; }
      .inline-icon { height: 60px; }
      .title-row-1 { font-size: 28px; }
      .title-row-2 { font-size: 18px; margin-top: -10px; }
      .copy-btn, .open-btn, .help-btn { font-size: 12px; }
    }

    .select-atencio-shake { animation: select-shake-wave 1.2s ease-in-out; }
    @keyframes select-shake-wave {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); background-color: #d4d9a8; }
      20%, 40%, 60%, 80% { transform: translateX(4px); background-color: #e5e8c8; }
    }

  <script>
    // ── Custom dropdown factory ──
    function makeCustomDropdown(wrapId, activities, defaultFile, onChangeCallback) {
      const wrap    = document.getElementById(wrapId);
      const trigger = wrap.querySelector('.cd-trigger');
      const list    = wrap.querySelector('.cd-list');
      const label   = wrap.querySelector('.cd-label');
      let currentFile = defaultFile;
      let activeIdx   = -1;   // opció ressaltada amb les fletxes del teclat

      // Accessibilitat: el disparador es comporta com un combobox (Tab, fletxes,
      // Home/End, Intro/Espai, Esc) i la llista com un listbox per als lectors de pantalla.
      list.id = wrapId + '-list';
      trigger.setAttribute('tabindex', '0');
      trigger.setAttribute('role', 'combobox');
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-controls', list.id);
      trigger.setAttribute('aria-expanded', 'false');
      const rowLabel = wrap.closest('.row')?.querySelector('label');
      if (rowLabel) {
        rowLabel.id = wrapId + '-label';
        trigger.setAttribute('aria-labelledby', rowLabel.id);
      }
      list.setAttribute('role', 'listbox');
      // La classe 'open' també la posen/treuen altres parts de la pàgina (clic fora):
      // mantenim aria-expanded sincronitzat amb ella.
      new MutationObserver(() => {
        const isOpen = wrap.classList.contains('open');
        trigger.setAttribute('aria-expanded', String(isOpen));
        if (!isOpen) setActive(-1);
      }).observe(wrap, { attributes: true, attributeFilter: ['class'] });

      function getValue() { return currentFile; }

      function choose(a) {
        currentFile = a.file;
        label.textContent = a.label;
        render();
        wrap.classList.remove('open');
        onChangeCallback();
      }

      function setActive(idx) {
        activeIdx = idx;
        list.querySelectorAll('.cd-option').forEach((el, i) => el.classList.toggle('active', i === idx));
        if (idx >= 0) {
          const el = document.getElementById(`${wrapId}-opt-${idx}`);
          trigger.setAttribute('aria-activedescendant', el.id);
          el.scrollIntoView({ block: 'nearest' });
        } else {
          trigger.removeAttribute('aria-activedescendant');
        }
      }

      function render() {
        list.innerHTML = '';
        activities.forEach((a, i) => {
          const div = document.createElement('div');
          div.className = 'cd-option' + (a.file === currentFile ? ' selected' : '');
          div.id = `${wrapId}-opt-${i}`;
          div.setAttribute('role', 'option');
          div.setAttribute('aria-selected', String(a.file === currentFile));
          div.innerHTML = `
            <svg class="cd-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="3 8 7 12 13 4"/>
            </svg>
            <span>${a.label}</span>`;
          div.addEventListener('click', () => choose(a));
          list.appendChild(div);
        });
      }

      const def = activities.find(a => a.file === defaultFile) || activities[0];
      label.textContent = def.label;
      render();

      function openList() {
        wrap.classList.add('open');
        // La llista no ha de sortir de la pantalla: s'ajusta a l'espai que queda sota el disparador
        const available = window.innerHeight - trigger.getBoundingClientRect().bottom - 12;
        list.style.maxHeight = Math.min(320, Math.max(100, available)) + 'px';
      }

      trigger.addEventListener('click', e => {
        e.stopPropagation();
        if (wrap.classList.contains('open')) wrap.classList.remove('open');
        else openList();
      });
      list.addEventListener('click', e => e.stopPropagation());

      trigger.addEventListener('keydown', e => {
        const isOpen = wrap.classList.contains('open');
        const selIdx = activities.findIndex(a => a.file === currentFile);
        switch (e.key) {
          case 'ArrowDown':
          case 'ArrowUp': {
            e.preventDefault();
            if (!isOpen) { openList(); setActive(selIdx); return; }
            const from = activeIdx >= 0 ? activeIdx : selIdx;
            const step = e.key === 'ArrowDown' ? 1 : -1;
            setActive(Math.min(activities.length - 1, Math.max(0, from + step)));
            break;
          }
          case 'Home':
          case 'End':
            if (!isOpen) return;
            e.preventDefault();
            setActive(e.key === 'Home' ? 0 : activities.length - 1);
            break;
          case 'Enter':
          case ' ':
            e.preventDefault();
            if (isOpen && activeIdx >= 0) choose(activities[activeIdx]);
            else if (isOpen) wrap.classList.remove('open');
            else { openList(); setActive(selIdx); }
            break;
          case 'Escape':
            if (isOpen) { e.preventDefault(); wrap.classList.remove('open'); }
            break;
          case 'Tab':
            wrap.classList.remove('open');
            break;
        }
      });

      return { getValue };
    }

    // ── Panel init ──
    function initPanel(suffix, activities, defaultFile) {
      const els = {
        s:      document.getElementById('s-' + suffix),
        o:      document.getElementById('o-' + suffix),
        i:      document.getElementById('i-' + suffix),
        fix:    document.getElementById('fix-' + suffix),
        rowFix: document.getElementById('row-fixed-' + suffix),
        link:   document.getElementById('l-' + suffix),
        copy:   document.getElementById('c-' + suffix),
        open:   document.getElementById('p-' + suffix),
        help:   document.getElementById('h-' + suffix),
        status: document.getElementById('st-' + suffix)
      };

      let timeout1, timeout2;

      // El camp «Sessió fixa» només surt per a les activitats que l'admeten.
      function manageFixedRow() {
        const selected = activities.find(a => a.file === dropdown.getValue());
        const admet = !!(selected && selected.fixed);
        els.rowFix.style.display = admet ? '' : 'none';
        // Quan s'amaga, es buida per no deixar un ?fixed= penjat a l'enllaç
        if (!admet) els.fix.value = '';
      }

      function build() {
        const file = dropdown.getValue();
        const qs = new URLSearchParams({
          totalsessions:    els.s.value,
          totaloperations:  els.o.value,
          maxintents:       els.i.value
        });
        if (els.fix.value) qs.set('fixed', els.fix.value);
        els.link.textContent = `${BASE_URL}${file}?${qs.toString()}`;
      }

      function manageHelpButton(isInitialLoad = false) {
        const selected = activities.find(a => a.file === dropdown.getValue());
        const hasVideo = selected && selected.yt && selected.yt.trim() !== '';
        clearTimeout(timeout1); clearTimeout(timeout2);
        if (isInitialLoad) {
          els.help.style.display = 'none';
          timeout1 = setTimeout(() => {
            const nowSel = activities.find(a => a.file === dropdown.getValue());
            if (nowSel && nowSel.yt) els.help.style.display = 'flex';
          }, 4500);
        } else {
          timeout1 = setTimeout(() => {
            els.help.style.display = 'none';
            timeout2 = setTimeout(() => { if (hasVideo) els.help.style.display = 'flex'; }, 800);
          }, 200);
        }
      }

      const dropdown = makeCustomDropdown('cd-' + suffix, activities, defaultFile, () => {
        manageFixedRow();
        build();
        manageHelpButton(false);
      });

      manageFixedRow();
      build();
      manageHelpButton(true);

      [els.s, els.o, els.i, els.fix].forEach(el => el.addEventListener('change', build));

      els.copy.addEventListener('click', async () => {
        // Si el navegador no deixa usar el porta-retalls (HTTP, navegador antic, permís denegat…)
        // se selecciona l'enllaç (és un <div>, no un textarea) i es prova la còpia clàssica.
        // Si tampoc funciona, l'enllaç queda seleccionat perquè es copiï a mà.
        let copiat = false;
        try {
          await navigator.clipboard.writeText(els.link.textContent);
          copiat = true;
        } catch {
          const range = document.createRange();
          range.selectNodeContents(els.link);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          try { copiat = document.execCommand('copy'); } catch { copiat = false; }
        }
        els.status.textContent = copiat ? 'Copiat ✅' : "Copia l'enllaç seleccionat (Ctrl+C)";
        setTimeout(() => els.status.textContent = '', copiat ? 2000 : 5000);
      });
      els.open.addEventListener('click', () => window.open(els.link.textContent, '_blank'));
      els.help.addEventListener('click', () => {
        const selected = activities.find(a => a.file === dropdown.getValue());
        if (selected && selected.yt) window.open(new URL(selected.yt, BASE_URL).href, '_blank');
      });
    }

    initPanel('eso', ACTIVITIES_ESO, DEFAULT_ESO);

    // Tanca dropdowns en clicar fora
    document.addEventListener('click', () => {
      document.querySelectorAll('.cd-wrap').forEach(w => w.classList.remove('open'));
    });

    // Shake d'atenció inicial
    window.addEventListener('load', () => {
      setTimeout(() => {
        const triggers = document.querySelectorAll('.cd-trigger');
        triggers.forEach(t => t.classList.add('select-atencio-shake'));
        setTimeout(() => triggers.forEach(t => t.classList.remove('select-atencio-shake')), 1250);
      }, 2220);
    });
  </script>
