<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proporcionalitat directa — versió adaptada per a diversitat">
    <link rel="icon" href="icon-green.png">
    <title>Proporcionalitat</title>

    <!--
    ============================================================
    FITXER: a-proporciodirecta.html
    ROL: Activitat de proporcionalitat directa per a l'aula d'acollida, per
         REDUCCIÓ A LA UNITAT (mai regla de tres). Tot enters.
    JAVASCRIPT: js/a-proporciodirecta/a-proporciodirecta.js (pantalla, teclat, punts),
         generador.js (problemes, lògica pura) i vista.js (l'HTML de cada peça);
         motor comú a js/game-core.js.

    COM ES LLEGEIX (sense frases, a propòsit):
      · «2 🍎 → 6 €» és la dada i «5 🍎 → ? €» el que es demana. El producte és una
        paraula del lèxic i es pot tocar (targeta «Aprèn la paraula»).
      · Botó 💡: l'operació sense la resposta («6 € ÷ 2 = ?») i els productes dibuixats.

    NIVELLS (via ?nivell=):
      Nivell 1: la quantitat demanada és múltiple de la donada (o al revés). Un pas.
                4 casos: 1→N, N→1, N→kN, kN→N. (default)
      Nivell 2: relació qualsevol. Dos passos: preu d'un (÷) i preu de la quantitat (×). Nombres petits.
      Nivell 3: com el 2, amb nombres més grans.

    PARÀMETRES URL COMPARTITS (via config.js):
      ?totalsessions=N    (default 1)
      ?totaloperations=N  (default 4)
      ?maxintents=N       (default 5)
      ?fixed=A|B|C        Sessió fixa (js/fixed-sessions.js)
    ============================================================
    -->

    <script>
        window.APP_CONFIG = {
            defaultSessions:      1,
            defaultOperations:    4,
            defaultIntents:       5
        };
    </script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/accessibilitat.css">

    <style>
        /* ── PALETA VERDA (coherent amb a-enters / a-equacions / a-decimals) ── */
        :root {
            --primary:       #5a6a1e;
            --primary-light: #e5e8c8;
            --primary-hover: #3d4a14;
            --primary-dark:  #1c1f0e;
        }

        h1         { color: #1c1f0e; margin-bottom: 2px; }
        .title-row { margin-bottom: 6px; }
        .panel     { border-top-color: var(--primary); }

        /* ── ZONA DEL PROBLEMA: dada + pregunta ──────────────── */
        .problem-display {
            padding: 24px 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .problem-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.8em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .problem-emoji { font-size: 1.1em; }

        /* «8 €» no es pot partir en dues línies */
        .problem-qty, .problem-price, .problem-unknown { white-space: nowrap; }

        .problem-qty {
            padding: 6px 14px;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            color: #334155;
        }

        .problem-arrow {
            color: #64748b;
            font-size: 0.9em;
        }

        .problem-price {
            padding: 6px 14px;
            background: #f0fdf4;
            border: 2px solid #bbf7d0;
            border-radius: 10px;
            color: #166534;
        }

        .problem-unknown {
            padding: 6px 14px;
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 10px;
            color: var(--primary-dark);
            animation: fadeIn 0.3s ease;
        }

        .done-row .problem-qty   { background: #dcfce7; border-color: #bbf7d0; }
        .done-row                { color: var(--success); font-size: 0.9em; }
        /* El producte és una paraula del lèxic (tocable): només mostra la vora quan és nova o s'hi passa pel damunt */
        .problem-qty .paraula       { border: 2px solid transparent; background: transparent; }
        .problem-qty .paraula-nova  { border-color: var(--paraula-destac, #f59e0b); }
        .problem-qty .paraula-img   { font-size: 1.2em; }

        /* ── PANELL DE RESOLUCIÓ ─────────────────────────────── */
        .resolution-panel {
            background: var(--bg-color);
            border-top: 1px solid var(--border-color);
            padding: 24px 20px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            animation: fadeIn 0.25s ease;
        }

        .step-done {
            color: var(--success);
            font-weight: 700;
            font-size: 1.1em;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .answer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 2em;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        input[type="text"]#value-input {
            width: 120px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85em;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            border: 2px solid var(--border-heavy);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="text"]#value-input:focus {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        input[type="text"]#value-input.reveal {
            border-color: var(--success);
            background: #dcfce7;
            color: #166534;
        }
        .answer-unit {
            color: #475569;
            font-size: 0.8em;
        }

        /* ── BOTONS: OK + Ajuda (a la mateixa fila que el camp) ── */
        #btn-submit-val {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0;
            width: 2.4rem;
            height: 2.4rem;
            background-color: #cbd5e1;
            color: #334155;
            border-color: #94a3b8;
            transition: background-color 0.15s, color 0.15s;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #btn-submit-val:focus-visible { outline: 3px solid var(--primary); }
        #btn-submit-val:active        { transform: scale(0.95); }
        @media (hover: hover) {
            #btn-submit-val:hover {
                background-color: var(--primary);
                border-color: var(--primary-dark);
                color: white;
            }
        }
        #btn-submit-val.error-shake {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: shake 0.2s;
        }

        .btn-ajuda {
            background: #fffbeb;
            color: #92400e;
            border: 2px solid #fbbf24;
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 0.65em;
            flex-shrink: 0;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-ajuda:hover  { background: #fef3c7; }
        .btn-ajuda:active { transform: scale(0.96); }

        /* ── AJUDA: l'operació i els productes dibuixats ──────── */
        .help-text {
            display: none;
            background: #fffbeb;
            border: 2px solid #fde68a;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 1.15em;
            color: #78350f;
            font-weight: 600;
            text-align: center;
            max-width: min(860px, 95%);
            line-height: 1.5;
            animation: fadeIn 0.25s ease;
        }
        .help-text.visible { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .ajuda-terme { font-family: 'Courier New', Courier, monospace; font-weight: 800; }
        .items-row   { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .item        { display: inline-flex; flex-direction: column; align-items: center; min-width: 2.2em; }
        .item-top    { font-family: 'Courier New', Courier, monospace; font-weight: 800; color: #166534; }
        .item-img    { font-size: 1.8em; line-height: 1.1; }

        /* ── NIVELL A LA CAPÇALERA ────────────────────────────── */
        .level-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .nivell-badge {
            font-size: 0.9em;
            color: var(--text-muted);
            font-weight: 600;
        }
        @media (max-width: 480px) {
            .level-row { justify-content: center; }
            .level-row .level-text { width: auto; }
        }

        /* ── BOTÓ TUTORIAL ────────────────────────────────────── */
        .btn-tutorial {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 16px;
            font-size: 0.9em;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            border: 2px solid var(--primary);
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
        }
        .btn-tutorial:hover  { background: #d4d9a8; }
        .btn-tutorial:active { transform: scale(0.96); }

        .tut-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #dc2626;
            flex-shrink: 0;
            animation: tutDotPulse 0.8s ease-in-out 5;
            animation-fill-mode: forwards;
        }
        @keyframes tutDotPulse {
            0%, 100% { opacity: 1;   transform: scale(1); }
            50%      { opacity: 0.2; transform: scale(0.65); }
        }

        #fade-overlay {
            position: fixed; inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        /* ── RESPONSIU ────────────────────────────────────────── */
        @media (max-width: 480px) {
            /* «PROPORCIONALITAT» és una sola paraula llarga: el botó «Tutorial» baixa a la línia següent */
            .title-row        { flex-wrap: wrap; row-gap: 6px; }
            .problem-display  { padding: 16px 8px 12px; gap: 12px; }
            .problem-row      { font-size: 1.25em; gap: 6px; flex-wrap: wrap; }
            .problem-qty,
            .problem-price,
            .problem-unknown  { padding: 5px 10px; border-radius: 8px; }
            .answer-row       { font-size: 1.6em; }
            input[type="text"]#value-input { width: 100px; padding: 10px; }
            .resolution-panel { padding: 16px 14px 18px; gap: 12px; }
            .help-text        { font-size: 1.05em; padding: 12px 14px; }
        }
        @media (max-width: 350px) {
            .problem-row { font-size: 1.1em; }
            .problem-qty,
            .problem-price,
            .problem-unknown { padding: 4px 8px; }
        }

        /* ── ANIMACIÓ INTENTS ────────────────────────────────── */
        @keyframes attemptsBlink {
            0%, 100% { background-color: #fef3c7; border-color: #d1d5db; color: #334155; }
            50%       { background-color: #e5e7eb; border-color: #f59e0b; color: #334155; }
        }
        .attempts-counter.blink { animation: attemptsBlink 0.2s linear 5; }
    </style>
    <link rel="stylesheet" href="css/chromebook.css">
</head>
<body>

<div class="title-row">
    <a href="index.html" class="home-icon-link" title="Tornar a l'inici" aria-label="Tornar a l'inici">
        <img src="icon-green.png" alt="Inici" onerror="this.style.display='none'">
    </a>
    <h1>Proporcionalitat</h1>
    <button class="btn-tutorial" id="btn-tutorial" aria-label="Veure tutorial">
        <span class="tut-dot" aria-hidden="true"></span>
        Tutorial
    </button>
</div>

<div id="fade-overlay"></div>

<div class="panel" id="main-panel">
    <div id="game-screen" style="display:none;">

        <div class="header-info">
            <div class="header-left">
                <div class="session-text" id="session-display">Sessió 1 de 1</div>
                <div class="level-row">
                    <div class="level-text"   id="lvl-display">Problema 1 de 4</div>
                    <div class="nivell-badge" id="nivell-display"></div>
                </div>
            </div>
            <div class="score-text"  id="score-display">Punts: 0</div>
            <div id="attempts-display" class="attempts-counter">Intents: 5</div>
        </div>

        <!-- Problema: dada + pregunta -->
        <div class="problem-display" id="problem-display"></div>

        <!-- Panell de resolució -->
        <div class="resolution-panel" id="resolution-panel">
            <div class="step-done" id="step-done" style="display:none;"></div>

            <!-- Camp + € + OK + ajuda en una sola fila -->
            <div class="answer-row" id="answer-row">
                <input type="text" id="value-input" autocomplete="off" aria-label="Escriu la resposta">
                <span class="answer-unit">€</span>
                <button class="btn-submit" id="btn-submit-val" onclick="checkValue()">OK</button>
                <button class="btn-ajuda" onclick="toggleHelp()" aria-label="Ajuda">💡</button>
            </div>

            <!-- L'ajuda: l'operació i els productes dibuixats -->
            <div class="help-text" id="help-text" aria-live="polite"></div>
        </div>

    </div>
    <!-- #mini-victory-overlay, #session-end-screen, #final-screen
         s'injecten via injectSharedHTML() de game-core.js -->
</div>

<script type="module" src="js/a-proporciodirecta/a-proporciodirecta.js"></script>
</body>
</html>
</html>
